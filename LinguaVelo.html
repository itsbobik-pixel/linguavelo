<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LinguaVelo">
<meta name="theme-color" content="#F7F8FC">
<title>LinguaVelo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F8FC;
    --surface: #FFFFFF;
    --surface2: #F0F2F9;
    --border: #E4E7F0;
    --text: #0F1123;
    --text-2: #6B7280;
    --text-3: #9CA3AF;
    --accent: #059669;
    --accent-2: #047857;
    --accent-soft: #ECFDF5;
    --easy: #059669;
    --easy-soft: #ECFDF5;
    --good: #2563EB;
    --good-soft: #EFF6FF;
    --hard: #DC2626;
    --hard-soft: #FEF2F2;
    --warn: #D97706;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 24px rgba(15,17,35,0.08);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1016;
      --surface: #171A23;
      --surface2: #1F2330;
      --border: #2A2F3E;
      --text: #ECEEF4;
      --text-2: #A3A9B8;
      --text-3: #6B7280;
      --accent: #34D399;
      --accent-2: #10B981;
      --accent-soft: #0F2A22;
      --easy: #34D399;
      --easy-soft: #0F2A22;
      --good: #60A5FA;
      --good-soft: #13213A;
      --hard: #F87171;
      --hard-soft: #351818;
      --warn: #FBBF24;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1016; --surface: #171A23; --surface2: #1F2330; --border: #2A2F3E;
    --text: #ECEEF4; --text-2: #A3A9B8; --text-3: #6B7280;
    --accent: #34D399; --accent-2: #10B981; --accent-soft: #0F2A22;
    --easy: #34D399; --easy-soft: #0F2A22; --good: #60A5FA; --good-soft: #13213A;
    --hard: #F87171; --hard-soft: #351818; --warn: #FBBF24;
    --shadow: 0 1px 3px rgba(0,0,0,0.4); --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── TOP BAR ── */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  .top .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
  .top h1 { font-size: 1.05em; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .sub { font-size: 0.75em; color: var(--text-2); font-weight: 500; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface2); font-size: 1.05em;
  }
  .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 1.25em; }
  .brand span { color: var(--accent); }

  main { padding: 20px 0 calc(40px + env(safe-area-inset-bottom)); }

  /* ── HOME ── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 12px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 1.5em; font-weight: 800; letter-spacing: -0.02em; }
  .stat small { color: var(--text-2); font-size: 0.78em; }
  .section-title { font-size: 0.8em; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 2px 10px; }

  .lesson {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow);
    transition: transform .12s;
  }
  .lesson:active { transform: scale(0.985); }
  .lesson .ico { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 1.5em; flex-shrink: 0; }
  .lesson .meta { flex: 1; min-width: 0; }
  .lesson .t { font-weight: 700; }
  .lesson .d { font-size: 0.8em; color: var(--text-2); margin-top: 2px; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
  .pct { font-weight: 800; font-size: 0.95em; color: var(--accent); min-width: 42px; text-align: right; }

  .empty { text-align: center; color: var(--text-2); padding: 40px 16px; font-size: 0.9em; line-height: 1.5; }

  /* ── LESSON ── */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .mode {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; text-align: left; box-shadow: var(--shadow); transition: transform .12s;
  }
  .mode:active { transform: scale(0.97); }
  .mode.first { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  .mode.first .mi { font-size: 1.8em; }
  .mode .mi { font-size: 1.4em; }
  .mode .mn { font-weight: 700; margin-top: 4px; }
  .mode.first .mn { margin-top: 0; }
  .mode .md { font-size: 0.76em; color: var(--text-2); margin-top: 2px; line-height: 1.35; }
  .mode .mp { font-size: 0.75em; font-weight: 700; color: var(--accent); margin-top: 8px; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 24px; font-size: 0.88em; }
  .switch { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--border); transition: background .2s; flex-shrink: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(18px); }

  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .list-head .section-title { margin: 0 2px; }
  .pill-btn { padding: 8px 14px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; font-size: 0.85em; }
  .phrase {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 12px 12px 14px; margin-bottom: 8px; transition: border-color .2s, background .2s;
  }
  .phrase.playing { border-color: var(--accent); background: var(--accent-soft); }
  .phrase .tx { flex: 1; min-width: 0; }
  .phrase .it { font-weight: 600; line-height: 1.35; }
  .phrase .src { font-size: 0.82em; color: var(--text-2); margin-top: 3px; line-height: 1.35; }
  .dots { display: flex; gap: 3px; margin-top: 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .dots i.easy { background: var(--easy); } .dots i.good { background: var(--good); } .dots i.hard { background: var(--hard); }
  .play { width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.95em; }
  .reset-link { display: block; margin: 20px auto 0; color: var(--text-3); font-size: 0.8em; text-decoration: underline; }

  /* ── SESSION ── */
  .session { display: flex; flex-direction: column; min-height: 100dvh; }
  .session .top { position: static; }
  .sbar { height: 4px; background: var(--surface2); }
  .sbar > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px 0; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
    box-shadow: var(--shadow-lg); padding: 28px 22px; text-align: center; min-height: 260px;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
  }
  .card .lbl { font-size: 0.72em; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .card .big { font-size: 1.45em; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .card .mid { font-size: 1.05em; color: var(--text-2); line-height: 1.4; }
  .card hr { border: none; border-top: 1px dashed var(--border); margin: 4px 0; }
  .card .it-ans { font-size: 1.35em; font-weight: 700; color: var(--accent); line-height: 1.3; overflow-wrap: anywhere; }
  .audio-row { display: flex; justify-content: center; gap: 10px; }
  .audio-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 1.3em; display: flex; align-items: center; justify-content: center; }
  .audio-btn.lg { width: 84px; height: 84px; font-size: 2em; }
  .audio-btn.slow { font-size: 1.15em; }

  .write-in {
    width: 100%; font: inherit; font-size: 1.1em; padding: 14px; border-radius: 14px;
    border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); resize: none; outline: none;
  }
  .write-in:focus { border-color: var(--accent); }
  .accents { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .accents button { width: 38px; height: 34px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); font-weight: 600; }

  .mic {
    width: 88px; height: 88px; border-radius: 50%; margin: 0 auto;
    background: var(--accent); color: #fff; font-size: 2em; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .mic.rec { background: var(--hard); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--hard) 45%, transparent); } 50% { box-shadow: 0 0 0 14px transparent; } }
  .heard { min-height: 1.4em; color: var(--text-2); font-style: italic; }

  .diff { font-size: 1.1em; line-height: 1.6; }
  .diff .ok { color: var(--easy); font-weight: 600; }
  .diff .miss { color: var(--hard); font-weight: 600; text-decoration: underline wavy; text-underline-offset: 4px; }
  .score { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 0.85em; }
  .score.hi { background: var(--easy-soft); color: var(--easy); }
  .score.mid { background: var(--good-soft); color: var(--good); }
  .score.lo { background: var(--hard-soft); color: var(--hard); }
  .note { font-size: 0.8em; color: var(--warn); }

  .foot { padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); }
  .foot .wrap { display: flex; gap: 10px; }
  .big-btn { flex: 1; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 1em; background: var(--accent); color: #fff; }
  .big-btn.ghost { background: var(--surface2); color: var(--text); flex: 0 0 auto; padding: 16px 18px; }
  .rate { flex: 1; padding: 12px 6px; border-radius: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1.5px solid transparent; }
  .rate small { font-weight: 500; font-size: 0.72em; opacity: 0.8; }
  .rate.hard { background: var(--hard-soft); color: var(--hard); border-color: color-mix(in srgb, var(--hard) 30%, transparent); }
  .rate.good { background: var(--good-soft); color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
  .rate.easy { background: var(--easy-soft); color: var(--easy); border-color: color-mix(in srgb, var(--easy) 30%, transparent); }
  .kbd-hint { text-align: center; font-size: 0.72em; color: var(--text-3); margin-top: 8px; }
  @media (hover: none) { .kbd-hint { display: none; } }

  .summary { text-align: center; }
  .summary .trophy { font-size: 3.4em; }
  .summary h2 { font-size: 1.4em; margin: 6px 0 4px; }
  .summary p { color: var(--text-2); }
  .sum-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0; }
  .sum-grid div { border-radius: 14px; padding: 14px 6px; font-weight: 700; }
  .sum-grid b { display: block; font-size: 1.6em; }
  .sum-grid .e { background: var(--easy-soft); color: var(--easy); }
  .sum-grid .g { background: var(--good-soft); color: var(--good); }
  .sum-grid .h { background: var(--hard-soft); color: var(--hard); }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  OBSAH — lekce a fráze
//  src  = česká nebo anglická fráze (jazyk se pozná sám, nebo lang: 'cs' / 'en')
//  it   = italský překlad
//  id   = trvalé ID (na něm visí pokrok, neměnit)
// ═══════════════════════════════════════════════════════════
const LESSONS = [
  {
    id: 'hotel',
    title: 'Hostel – recepce',
    icon: '🏨',
    phrases: [
      { id: "hotel-1", src: "Welcome to the hostel, my name is Bob", it: "Benvenuti all'ostello, mi chiamo Bob" },
      { id: "hotel-2", src: "What is your name?", it: "Come ti chiami?" },
      { id: "hotel-3", src: "How are you?", it: "Come stai?" },
      { id: "hotel-4", src: "Can I help you with the luggage?", it: "Posso aiutarla con i bagagli?" },
      { id: "hotel-5", src: "You can sit down here and put your luggage down", it: "Puoi sederti qui e appoggiare i tuoi bagagli." },
      { id: "hotel-6", src: "Can I bring you a glass of water, juice or coffee?", it: "Posso portarle un bicchiere d'acqua, di succo di frutta o di caffè?" },
      { id: "hotel-7", src: "What brings you to La Spezia?", it: "Cosa ti porta a La Spezia?" },
      { id: "hotel-8", src: "Are you here for the Cinque Terre?", it: "Siete qui per le Cinque Terre?" },
      { id: "hotel-9", src: "Let me show you around the hostel.", it: "Lasciatemi mostrarvi l'ostello." },
      { id: "hotel-10", src: "This is the kitchen. The breakfast table. Fridge. Dishwasher. Coffee.", it: "Questa è la cucina. Il tavolo della colazione. Frigorifero. Lavastoviglie. Caffè." },
      { id: "hotel-11", src: "This is the terrace. It is open from 8 to 11", it: "Questa è la terrazza. È aperta dalle 8 alle 11." },
      { id: "hotel-12", src: "This is the bathroom. Each room has a toilet and a shower.", it: "Questo è il bagno. Ogni camera ha un WC e una doccia." },
      { id: "hotel-13", src: "Can you give me your id or passport?", it: "Può darmi un documento d'identità o il passaporto?" },
      { id: "hotel-14", src: "Thank you very much.", it: "Grazie mille" },
      { id: "hotel-15", src: "Will you pay by card or cash?", it: "Preferisci pagare con carta o in contanti?" },
      { id: "hotel-16", src: "Do you want a towel? It is free.", it: "Desideri un asciugamano? È gratuito." },
      { id: "hotel-17", src: "Let me get your bed sheets and show you your room.", it: "Lasciami prendere le lenzuola e mostrarti la tua stanza." },
      { id: "hotel-18", src: "If you need anything, let me know.", it: "Se hai bisogno di qualcosa, fammelo sapere." },
    ],
  },
];

// ═══════════════════════════════════════════════════════════
//  REŽIMY (Rocket-style)
// ═══════════════════════════════════════════════════════════
const MODES = [
  { id: 'reveal', icon: '🃏', name: 'Flashcards', desc: 'Vidíš frázi, odkryješ italštinu' },
  { id: 'hear',   icon: '🎧', name: 'Hear it',    desc: 'Slyšíš italsky – rozumíš?' },
  { id: 'know',   icon: '🧠', name: 'Know it',    desc: 'Čteš italsky – víš, co to znamená?' },
  { id: 'write',  icon: '✍️', name: 'Write it',   desc: 'Napiš to italsky' },
  { id: 'say',    icon: '🎤', name: 'Say it',     desc: 'Řekni to italsky do mikrofonu' },
];
const RATING_POINTS = { hard: 1, good: 2, easy: 3 };

// ═══════════════════════════════════════════════════════════
//  POKROK (localStorage)
// ═══════════════════════════════════════════════════════════
const STORE_KEY = 'lv2-progress';
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.cards) return s;
  } catch {}
  return { cards: {}, points: 0, days: [] };
}
let store = loadStore();
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {} }

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function rate(phraseId, mode, rating) {
  (store.cards[phraseId] ||= {})[mode] = rating;
  store.points += RATING_POINTS[rating];
  const t = today();
  if (!store.days.includes(t)) store.days.push(t);
  saveStore();
}
function getRating(phraseId, mode) { return store.cards[phraseId]?.[mode] || null; }

function streak() {
  const set = new Set(store.days);
  const d = new Date();
  const key = () => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  if (!set.has(key())) d.setDate(d.getDate() - 1); // dnešek se ještě může dohnat
  let n = 0;
  while (set.has(key())) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function modeProgress(lesson, mode) {
  if (!lesson.phrases.length) return 0;
  const sum = lesson.phrases.reduce((a, p) => a + (RATING_POINTS[getRating(p.id, mode)] || 0), 0);
  return Math.round(sum / (lesson.phrases.length * 3) * 100);
}
function lessonProgress(lesson) {
  return Math.round(MODES.reduce((a, m) => a + modeProgress(lesson, m.id), 0) / MODES.length);
}
function masteredCount() {
  // fráze ohodnocená jako "easy" ve všech režimech
  return LESSONS.flatMap(l => l.phrases).filter(p => MODES.every(m => getRating(p.id, m.id) === 'easy')).length;
}

// ═══════════════════════════════════════════════════════════
//  ŘEČ — TTS
// ═══════════════════════════════════════════════════════════
const synth = window.speechSynthesis;
let itVoice = null;
function pickVoice() {
  const voices = synth ? synth.getVoices() : [];
  const it = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('it'));
  itVoice = it.find(v => /google|alice|federica|elsa|natural/i.test(v.name)) || it[0] || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

function srcLang(p) {
  if (p.lang) return p.lang === 'cs' ? 'cs-CZ' : 'en-US';
  return /[ěščřžýáíéůúťďňĚŠČŘŽÝÁÍÉŮÚŤĎŇ]/.test(p.src) ? 'cs-CZ' : 'en-US';
}
function flag(p) { return srcLang(p) === 'cs-CZ' ? '🇨🇿' : '🇬🇧'; }

let speakGen = 0;
function speak(text, lang = 'it-IT', rate = 0.95) {
  return new Promise(resolve => {
    if (!synth) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate;
    if (lang === 'it-IT' && itVoice) u.voice = itVoice;
    u.onend = resolve; u.onerror = resolve;
    synth.speak(u);
  });
}
function stopSpeech() { speakGen++; if (synth) synth.cancel(); }
function sayIt(text, slow = false) { stopSpeech(); return speak(text, 'it-IT', slow ? 0.65 : 0.95); }
const pause = ms => new Promise(r => setTimeout(r, ms));

// ═══════════════════════════════════════════════════════════
//  POROVNÁNÍ ODPOVĚDI (Write it / Say it)
// ═══════════════════════════════════════════════════════════
const stripAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const tokens = s => s.replace(/[’`]/g, "'").replace(/[.,!?;:"«»()¿¡…–-]/g, ' ').replace(/'/g, "' ").split(/\s+/).filter(Boolean);

function compare(expected, given) {
  const exp = tokens(expected), giv = tokens(given);
  const norm = w => stripAcc(w.toLowerCase());
  const e = exp.map(norm), g = giv.map(norm);
  // LCS na slovech (bez diakritiky)
  const dp = Array.from({ length: e.length + 1 }, () => new Array(g.length + 1).fill(0));
  for (let i = e.length - 1; i >= 0; i--)
    for (let j = g.length - 1; j >= 0; j--)
      dp[i][j] = e[i] === g[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const matched = new Array(e.length).fill(false);
  let accentIssue = false;
  for (let i = 0, j = 0; i < e.length && j < g.length;) {
    if (e[i] === g[j]) { matched[i] = true; if (exp[i].toLowerCase() !== giv[j].toLowerCase()) accentIssue = true; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
    else j++;
  }
  const hits = matched.filter(Boolean).length;
  const extra = Math.max(0, g.length - hits);
  const score = e.length ? Math.max(0, Math.round((hits - extra * 0.5) / e.length * 100)) : 0;
  return { words: exp.map((w, i) => ({ w, ok: matched[i] })), score, accentIssue };
}
function diffHtml(res) {
  return res.words.map((x, i) => `<span class="${x.ok ? 'ok' : 'miss'}">${esc(x.w)}</span>` + (x.w.endsWith("'") || i === res.words.length - 1 ? '' : ' ')).join('');
}
function scoreBadge(score) {
  const cls = score >= 90 ? 'hi' : score >= 60 ? 'mid' : 'lo';
  return `<span class="score ${cls}">${score} %</span>`;
}
function suggestRating(score) { return score >= 90 ? 'easy' : score >= 60 ? 'good' : 'hard'; }

// ═══════════════════════════════════════════════════════════
//  UTIL
// ═══════════════════════════════════════════════════════════
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const findLesson = id => LESSONS.find(l => l.id === id);
const findMode = id => MODES.find(m => m.id === id);
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function phraseWord(n) { return n === 1 ? 'fráze' : (n >= 2 && n <= 4 ? 'fráze' : 'frází'); }

let hardOnly = false;
try { hardOnly = localStorage.getItem('lv2-hard-only') === '1'; } catch {}

// ═══════════════════════════════════════════════════════════
//  ROUTER  (#/  ·  #/l/ID  ·  #/l/ID/MODE)
// ═══════════════════════════════════════════════════════════
function route() {
  stopSpeech(); stopRecognition(); playAllGen++;
  window.scrollTo(0, 0);
  const [, view, id, mode] = location.hash.replace(/^#\/?/, '#/').split('/');
  const lesson = id && findLesson(decodeURIComponent(id));
  if (view === 'l' && lesson && mode && findMode(mode)) return startSession(lesson, mode);
  if (view === 'l' && lesson) return renderLesson(lesson);
  renderHome();
}
window.addEventListener('hashchange', route);
function go(hash) { location.hash = hash; }

// ═══════════════════════════════════════════════════════════
//  HOME
// ═══════════════════════════════════════════════════════════
function renderHome() {
  document.title = 'LinguaVelo';
  const total = LESSONS.reduce((a, l) => a + l.phrases.length, 0);
  app.innerHTML = `
    <header class="top"><div class="wrap">
      <div class="brand" style="flex:1">Lingua<span>Velo</span></div>
      <div class="sub">🇮🇹 italština</div>
    </div></header>
    <main><div class="wrap">
      <div class="stats">
        <div class="stat"><b>🔥 ${streak()}</b><small>dní v řadě</small></div>
        <div class="stat"><b>⭐ ${store.points}</b><small>bodů</small></div>
        <div class="stat"><b>✅ ${masteredCount()}</b><small>z ${total} zvládnuto</small></div>
      </div>
      <div class="section-title">Lekce</div>
      ${LESSONS.length ? LESSONS.map(l => {
        const pct = lessonProgress(l);
        return `<button class="lesson" data-go="#/l/${encodeURIComponent(l.id)}">
          <div class="ico">${l.icon || '📘'}</div>
          <div class="meta">
            <div class="t">${esc(l.title)}</div>
            <div class="d">${l.phrases.length} ${phraseWord(l.phrases.length)}</div>
            <div class="bar"><i style="width:${pct}%"></i></div>
          </div>
          <div class="pct">${pct} %</div>
        </button>`;
      }).join('') : `<div class="empty">Zatím žádné lekce.</div>`}
    </div></main>`;
  bindGo();
}

// ═══════════════════════════════════════════════════════════
//  LEKCE
// ═══════════════════════════════════════════════════════════
let playAllGen = 0;
function renderLesson(lesson) {
  document.title = `${lesson.title} · LinguaVelo`;
  const pct = lessonProgress(lesson);
  const hardCount = lesson.phrases.filter(p => MODES.some(m => getRating(p.id, m.id) !== 'easy')).length;
  app.innerHTML = `
    <header class="top"><div class="wrap">
      <button class="icon-btn" data-go="#/" aria-label="Zpět">←</button>
      <div style="flex:1;min-width:0">
        <h1>${lesson.icon || ''} ${esc(lesson.title)}</h1>
        <div class="sub">${lesson.phrases.length} ${phraseWord(lesson.phrases.length)} · ${pct} % hotovo</div>
      </div>
    </div></header>
    <main><div class="wrap">
      <div class="modes">
        ${MODES.map((m, i) => `
          <button class="mode${i === 0 ? ' first' : ''}" data-go="#/l/${encodeURIComponent(lesson.id)}/${m.id}">
            <div class="mi">${m.icon}</div>
            <div style="flex:1">
              <div class="mn">${m.name}</div>
              <div class="md">${m.desc}</div>
              <div class="bar"><i style="width:${modeProgress(lesson, m.id)}%"></i></div>
              <div class="mp">${modeProgress(lesson, m.id)} %</div>
            </div>
          </button>`).join('')}
      </div>
      <div class="toggle-row">
        <div><b>Jen těžké a nové</b><div style="color:var(--text-2);font-size:0.9em;margin-top:2px">Přeskočí fráze, které máš v daném režimu na Easy</div></div>
        <button class="switch${hardOnly ? ' on' : ''}" id="hardToggle" aria-label="Jen těžké a nové"></button>
      </div>
      <div class="list-head">
        <div class="section-title">Fráze</div>
        <button class="pill-btn" id="playAll">▶ Přehrát vše</button>
      </div>
      ${lesson.phrases.map((p, i) => `
        <div class="phrase" id="ph-${i}">
          <div class="tx">
            <div class="it">${esc(p.it)}</div>
            <div class="src">${flag(p)} ${esc(p.src)}</div>
            <div class="dots">${MODES.map(m => `<i class="${getRating(p.id, m.id) || ''}" title="${m.name}"></i>`).join('')}</div>
          </div>
          <button class="play" data-play="${i}" aria-label="Přehrát">🔊</button>
        </div>`).join('')}
      <button class="reset-link" id="resetLesson">Vynulovat pokrok lekce</button>
    </div></main>`;
  bindGo();

  document.getElementById('hardToggle').onclick = e => {
    hardOnly = !hardOnly;
    e.currentTarget.classList.toggle('on', hardOnly);
    try { localStorage.setItem('lv2-hard-only', hardOnly ? '1' : '0'); } catch {}
  };
  app.querySelectorAll('[data-play]').forEach(b => b.onclick = () => {
    playAllGen++;
    setPlaying(null);
    sayIt(lesson.phrases[+b.dataset.play].it);
  });
  const playBtn = document.getElementById('playAll');
  playBtn.onclick = async () => {
    if (playBtn.dataset.on) { playAllGen++; stopSpeech(); setPlaying(null); playBtn.textContent = '▶ Přehrát vše'; delete playBtn.dataset.on; return; }
    const gen = ++playAllGen; stopSpeech();
    playBtn.dataset.on = '1'; playBtn.textContent = '⏸ Zastavit';
    for (let i = 0; i < lesson.phrases.length && gen === playAllGen; i++) {
      const p = lesson.phrases[i];
      setPlaying(i);
      await speak(p.src, srcLang(p)); if (gen !== playAllGen) break;
      await pause(500); if (gen !== playAllGen) break;
      await speak(p.it); if (gen !== playAllGen) break;
      await pause(900);
    }
    if (gen === playAllGen) { setPlaying(null); playBtn.textContent = '▶ Přehrát vše'; delete playBtn.dataset.on; }
  };
  document.getElementById('resetLesson').onclick = () => {
    if (!confirm(`Opravdu vynulovat pokrok lekce „${lesson.title}“?`)) return;
    lesson.phrases.forEach(p => delete store.cards[p.id]);
    saveStore(); renderLesson(lesson);
  };
}
function setPlaying(i) {
  app.querySelectorAll('.phrase.playing').forEach(el => el.classList.remove('playing'));
  if (i === null) return;
  const el = document.getElementById(`ph-${i}`);
  if (el) { el.classList.add('playing'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

// ═══════════════════════════════════════════════════════════
//  SESSION (flashcards)
// ═══════════════════════════════════════════════════════════
let S = null; // { lesson, mode, queue, idx, revealed, results, requeued, check }

function startSession(lesson, mode, only = null) {
  let pool = lesson.phrases;
  if (only) pool = pool.filter(p => only.includes(p.id));
  else if (hardOnly) {
    const f = pool.filter(p => getRating(p.id, mode) !== 'easy');
    pool = f.length ? f : pool;
  }
  S = { lesson, mode, queue: shuffle(pool), idx: 0, revealed: false, results: {}, requeued: new Set(), check: null };
  document.title = `${findMode(mode).name} · ${lesson.title}`;
  renderCard();
}

function renderCard() {
  const { lesson, mode, queue, idx } = S;
  if (idx >= queue.length) return renderSummary();
  const p = queue[idx];
  const m = findMode(mode);
  const done = Object.keys(S.results).length;
  const total = new Set(queue.map(q => q.id)).size;
  S.revealed = false; S.check = null;

  app.innerHTML = `
    <div class="session">
      <header class="top"><div class="wrap">
        <button class="icon-btn" data-go="#/l/${encodeURIComponent(lesson.id)}" aria-label="Zavřít">✕</button>
        <div style="flex:1;min-width:0">
          <h1>${m.icon} ${m.name}</h1>
          <div class="sub">${esc(lesson.title)}</div>
        </div>
        <div class="sub" style="font-weight:700;color:var(--accent)">${Math.min(done + 1, total)} / ${total}</div>
      </div><div class="sbar"><i style="width:${done / total * 100}%"></i></div></header>
      <div class="stage"><div class="wrap"><div class="card" id="card">${promptHtml(p, mode)}</div></div></div>
      <div class="foot"><div class="wrap" id="foot"></div><div class="kbd-hint" id="kbd"></div></div>
    </div>`;
  bindGo();
  renderFoot();
  wirePrompt(p, mode);
}

function promptHtml(p, mode) {
  const srcBlock = `<div class="lbl">${flag(p)} Jak se řekne italsky?</div><div class="big">${esc(p.src)}</div>`;
  switch (mode) {
    case 'reveal': return srcBlock;
    case 'hear': return `
      <div class="lbl">🎧 Poslouchej</div>
      <div class="audio-row">
        <button class="audio-btn lg" data-say="0" aria-label="Přehrát">🔊</button>
        <button class="audio-btn slow" data-say="1" aria-label="Pomalu" style="align-self:center">🐢</button>
      </div>
      <div class="mid">Co to znamená?</div>`;
    case 'know': return `<div class="lbl">🇮🇹 Co to znamená?</div><div class="big">${esc(p.it)}</div>`;
    case 'write': return `${srcBlock}
      <textarea class="write-in" id="answer" rows="2" lang="it" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Napiš italsky…"></textarea>
      <div class="accents">${['à', 'è', 'é', 'ì', 'ò', 'ù'].map(c => `<button data-acc="${c}">${c}</button>`).join('')}</div>`;
    case 'say': return `${srcBlock}
      <button class="mic" id="mic" aria-label="Mluvit">🎤</button>
      <div class="heard" id="heard">Klepni a řekni to italsky</div>`;
  }
}

function wirePrompt(p, mode) {
  app.querySelectorAll('[data-say]').forEach(b => b.onclick = () => sayIt(p.it, b.dataset.say === '1'));
  if (mode === 'hear') setTimeout(() => S && !S.revealed && sayIt(p.it), 250);
  if (mode === 'write') {
    const ta = document.getElementById('answer');
    setTimeout(() => ta.focus(), 50);
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); checkWritten(); } });
    app.querySelectorAll('[data-acc]').forEach(b => {
      b.onmousedown = e => e.preventDefault(); // nechat focus v textarea
      b.onclick = () => {
        const s = ta.selectionStart, eIdx = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + b.dataset.acc + ta.value.slice(eIdx);
        ta.selectionStart = ta.selectionEnd = s + 1; ta.focus();
      };
    });
  }
  if (mode === 'say') document.getElementById('mic').onclick = () => toggleRecognition(p);
}

function renderFoot() {
  const foot = document.getElementById('foot');
  const kbd = document.getElementById('kbd');
  if (!S.revealed) {
    if (S.mode === 'write') {
      foot.innerHTML = `<button class="big-btn ghost" id="dunno">Nevím</button><button class="big-btn" id="checkBtn">Zkontrolovat</button>`;
      document.getElementById('checkBtn').onclick = checkWritten;
      document.getElementById('dunno').onclick = () => reveal();
      kbd.textContent = 'Enter = zkontrolovat';
    } else {
      foot.innerHTML = `<button class="big-btn" id="revealBtn">Odkrýt</button>`;
      document.getElementById('revealBtn').onclick = () => reveal();
      kbd.textContent = 'Mezerník = odkrýt';
    }
  } else {
    const sug = S.check ? suggestRating(S.check.score) : null;
    foot.innerHTML = ['hard', 'good', 'easy'].map(r => `
      <button class="rate ${r}" data-rate="${r}" ${sug === r ? 'style="border-width:2.5px;border-color:currentColor"' : ''}>
        ${{ hard: 'Hard', good: 'Good', easy: 'Easy' }[r]}<small>${{ hard: 'Znovu', good: 'Skoro', easy: 'Umím' }[r]}</small>
      </button>`).join('');
    foot.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => rateCard(b.dataset.rate));
    kbd.textContent = '1 = Hard · 2 = Good · 3 = Easy';
  }
}

function reveal() {
  if (S.revealed) return;
  stopRecognition();
  const p = S.queue[S.idx];
  S.revealed = true;
  const card = document.getElementById('card');
  const audio = `<div class="audio-row"><button class="audio-btn" data-say="0" aria-label="Přehrát">🔊</button><button class="audio-btn slow" data-say="1" aria-label="Pomalu">🐢</button></div>`;
  let checkHtml = '';
  if (S.check) {
    checkHtml = `<div>${scoreBadge(S.check.score)}</div>
      ${S.check.given ? `<div class="mid" style="font-size:0.9em">Tvoje: „${esc(S.check.given)}“</div>` : ''}
      ${S.check.score < 100 ? `<div class="diff">${diffHtml(S.check)}</div>` : ''}
      ${S.check.accentIssue && S.mode === 'write' ? '<div class="note">Pozor na přízvuky (à è é ì ò ù)</div>' : ''}<hr>`;
  }
  switch (S.mode) {
    case 'reveal':
      card.innerHTML = `<div class="lbl">${flag(p)}</div><div class="mid">${esc(p.src)}</div><hr><div class="it-ans">${esc(p.it)}</div>${audio}`;
      break;
    case 'hear':
    case 'know':
      card.innerHTML = `<div class="lbl">🇮🇹</div><div class="it-ans">${esc(p.it)}</div>${audio}<hr><div class="lbl">${flag(p)} Význam</div><div class="big" style="font-size:1.2em">${esc(p.src)}</div>`;
      break;
    case 'write':
    case 'say':
      card.innerHTML = `<div class="mid">${flag(p)} ${esc(p.src)}</div><hr>${checkHtml}<div class="it-ans">${esc(p.it)}</div>${audio}`;
      break;
  }
  app.querySelectorAll('[data-say]').forEach(b => b.onclick = () => sayIt(p.it, b.dataset.say === '1'));
  if (S.mode !== 'hear') sayIt(p.it);
  renderFoot();
}

function checkWritten() {
  const ta = document.getElementById('answer');
  const given = ta ? ta.value.trim() : '';
  if (!given) return reveal();
  const p = S.queue[S.idx];
  S.check = { ...compare(p.it, given), given };
  reveal();
}

function rateCard(r) {
  if (!S || !S.revealed) return;
  const p = S.queue[S.idx];
  rate(p.id, S.mode, r);
  S.results[p.id] = r; // poslední hodnocení se počítá
  if (r === 'hard' && !S.requeued.has(p.id)) { S.requeued.add(p.id); S.queue.push(p); }
  S.idx++;
  stopSpeech();
  renderCard();
}

function renderSummary() {
  const { lesson, mode } = S;
  const vals = Object.values(S.results);
  const c = { easy: 0, good: 0, hard: 0 };
  vals.forEach(v => c[v]++);
  const pts = vals.reduce((a, v) => a + RATING_POINTS[v], 0);
  const hardIds = Object.keys(S.results).filter(id => S.results[id] !== 'easy');
  const pct = vals.length ? Math.round(pts / (vals.length * 3) * 100) : 0;
  const m = findMode(mode);
  app.innerHTML = `
    <div class="session">
      <header class="top"><div class="wrap">
        <button class="icon-btn" data-go="#/l/${encodeURIComponent(lesson.id)}" aria-label="Zavřít">✕</button>
        <h1>${m.icon} ${m.name}</h1>
      </div><div class="sbar"><i style="width:100%"></i></div></header>
      <div class="stage"><div class="wrap summary">
        <div class="trophy">${pct >= 85 ? '🏆' : pct >= 60 ? '💪' : '🌱'}</div>
        <h2>${pct >= 85 ? 'Bravissimo!' : pct >= 60 ? 'Bene!' : 'Avanti così!'}</h2>
        <p>${esc(lesson.title)} · ${m.name} · +${pts} bodů</p>
        <div class="sum-grid">
          <div class="e"><b>${c.easy}</b>Easy</div>
          <div class="g"><b>${c.good}</b>Good</div>
          <div class="h"><b>${c.hard}</b>Hard</div>
        </div>
      </div></div>
      <div class="foot"><div class="wrap">
        ${hardIds.length ? `<button class="big-btn ghost" id="again" style="flex:1">Zopakovat ${hardIds.length} slabší</button>` : ''}
        <button class="big-btn" data-go="#/l/${encodeURIComponent(lesson.id)}">Hotovo</button>
      </div></div>
    </div>`;
  bindGo();
  const again = document.getElementById('again');
  if (again) again.onclick = () => startSession(lesson, mode, hardIds);
  S.finished = true;
}

// ═══════════════════════════════════════════════════════════
//  SAY IT — rozpoznávání řeči
// ═══════════════════════════════════════════════════════════
let rec = null;
function stopRecognition() {
  if (rec) { const r = rec; rec = null; try { r.stop(); } catch {} }
  const mic = document.getElementById('mic');
  if (mic) { mic.classList.remove('rec'); mic.textContent = '🎤'; }
}
function toggleRecognition(p) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const heard = document.getElementById('heard');
  if (!SR) { heard.textContent = 'Tento prohlížeč neumí rozpoznávat řeč – řekni to nahlas a odkryj.'; return; }
  if (rec) { finishSpeech(p); return; }
  stopSpeech();
  const mic = document.getElementById('mic');
  mic.classList.add('rec'); mic.textContent = '⏹';
  heard.textContent = 'Poslouchám… (klepni znovu pro konec)';
  let finalT = '', interimT = '';
  const r = new SR();
  r.lang = 'it-IT'; r.continuous = true; r.interimResults = true;
  r.onresult = e => {
    interimT = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalT += e.results[i][0].transcript + ' ';
      else interimT += e.results[i][0].transcript;
    }
    heard.textContent = (finalT + interimT).trim() || '…';
    r._text = (finalT + interimT).trim();
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') heard.textContent = 'Přístup k mikrofonu zamítnut.';
  };
  r.onend = () => { if (rec === r) finishSpeech(p); };
  rec = r;
  try { r.start(); } catch { stopRecognition(); }
}
function finishSpeech(p) {
  const text = rec ? rec._text || '' : '';
  stopRecognition();
  if (!S || S.revealed) return;
  if (!text) { const h = document.getElementById('heard'); if (h) h.textContent = 'Nic jsem neslyšel – zkus to znovu.'; return; }
  S.check = { ...compare(p.it, text), given: text };
  reveal();
}

// ═══════════════════════════════════════════════════════════
//  KLÁVESNICE
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (!S || S.finished || !location.hash.match(/^#\/l\/[^/]+\/\w+/)) return;
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (!S.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
  else if (S.revealed && ['1', '2', '3'].includes(e.key)) rateCard(['hard', 'good', 'easy'][+e.key - 1]);
  else if (e.key === 'Escape') go(`#/l/${encodeURIComponent(S.lesson.id)}`);
});

function bindGo() { app.querySelectorAll('[data-go]').forEach(el => el.onclick = () => go(el.dataset.go)); }

route();
</script>
</body>
</html>
