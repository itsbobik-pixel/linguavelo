<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobik Italian">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#CE2B37">
<title>Bobik Speaks Italian</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FBF7F6;
    --surface: #FFFFFF;
    --surface2: #FBEDEC;
    --border: #F1E1DF;
    --text: #1F1214;
    --text-2: #6E5D5F;
    --text-3: #A8989A;
    --accent: #CE2B37;
    --accent-2: #A51F2A;
    --accent-soft: #FDECEC;
    --bar: #CE2B37;
    --easy: #059669;
    --easy-soft: #ECFDF5;
    --good: #2563EB;
    --good-soft: #EFF6FF;
    --hard: #EA580C;
    --hard-soft: #FFF4ED;
    --warn: #D97706;
    --shadow: 0 1px 3px rgba(80,20,20,0.06), 0 1px 2px rgba(80,20,20,0.04);
    --shadow-lg: 0 8px 24px rgba(80,20,20,0.10);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12100F; --surface: #1C1817; --surface2: #2A2221; --border: #3A2E2C;
      --text: #F3ECEB; --text-2: #B9A9A7; --text-3: #7A6A68;
      --accent: #F0525C; --accent-2: #D93A45; --accent-soft: #3A1A1D; --bar: #9E1F29;
      --easy: #34D399; --easy-soft: #0F2A22; --good: #60A5FA; --good-soft: #13213A;
      --hard: #FB923C; --hard-soft: #3A2312; --warn: #FBBF24;
      --shadow: 0 1px 3px rgba(0,0,0,0.4); --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12100F; --surface: #1C1817; --surface2: #2A2221; --border: #3A2E2C;
    --text: #F3ECEB; --text-2: #B9A9A7; --text-3: #7A6A68;
    --accent: #F0525C; --accent-2: #D93A45; --accent-soft: #3A1A1D; --bar: #9E1F29;
    --easy: #34D399; --easy-soft: #0F2A22; --good: #60A5FA; --good-soft: #13213A;
    --hard: #FB923C; --hard-soft: #3A2312; --warn: #FBBF24;
    --shadow: 0 1px 3px rgba(0,0,0,0.4); --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── TOP BAR ── */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: var(--bar); color: #fff;
    box-shadow: 0 2px 10px rgba(120,20,25,0.18);
    padding-top: env(safe-area-inset-top);
  }
  .top .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
  .top h1 { font-size: 1.05em; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .sub { font-size: 0.75em; color: rgba(255,255,255,0.82); font-weight: 500; }
  .top .icon-btn { background: rgba(255,255,255,0.18); color: #fff; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface2); font-size: 1.05em;
  }
  .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 1.2em; }
  .brand span { font-weight: 600; opacity: 0.9; }

  main { padding: 20px 0 calc(40px + env(safe-area-inset-bottom)); }

  /* ── HOME ── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 12px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 1.5em; font-weight: 800; letter-spacing: -0.02em; }
  .stat small { color: var(--text-2); font-size: 0.78em; }
  .section-title { font-size: 0.8em; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 2px 10px; }

  .lesson {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow);
    transition: transform .12s;
  }
  .lesson:active { transform: scale(0.985); }
  .lesson .ico { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 1.5em; flex-shrink: 0; }
  .lesson .meta { flex: 1; min-width: 0; }
  .lesson .t { font-weight: 700; }
  .lesson .d { font-size: 0.8em; color: var(--text-2); margin-top: 2px; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
  .pct { font-weight: 800; font-size: 0.95em; color: var(--accent); min-width: 42px; text-align: right; }

  .level-head { margin: 26px 2px 10px; }
  .level-head:first-of-type { margin-top: 0; }
  .level-head .lt { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .level-head .ln { font-size: 0.72em; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
  .level-head h2 { font-size: 1.1em; font-weight: 800; letter-spacing: -0.01em; margin-top: 2px; }
  .level-head p { font-size: 0.8em; color: var(--text-2); margin-top: 3px; line-height: 1.4; }
  .level-head .lp { font-size: 0.8em; font-weight: 700; color: var(--text-2); white-space: nowrap; }
  .lesson .num { font-size: 0.7em; font-weight: 700; color: var(--text-3); }
  .lesson.next { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .next-badge { display: inline-block; font-size: 0.68em; font-weight: 800; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }
  .notes { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: var(--radius); margin-bottom: 14px; box-shadow: var(--shadow); }
  .notes summary { padding: 13px 14px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  .notes summary::-webkit-details-marker { display: none; }
  .notes summary::after { content: '▾'; color: var(--text-3); transition: transform .2s; }
  .notes[open] summary::after { transform: rotate(180deg); }
  .notes ul { padding: 0 16px 14px 32px; display: flex; flex-direction: column; gap: 8px; font-size: 0.9em; line-height: 1.5; color: var(--text-2); }
  .notes b { color: var(--text); }
  .next-lesson { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 18px; padding: 14px; border-radius: var(--radius); background: var(--accent); color: #fff; text-align: left; font-weight: 700; }
  .next-lesson small { display: block; font-weight: 500; opacity: 0.85; font-size: 0.8em; }
  /* konverzace */
  .dlg-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .dlg-top { display: flex; gap: 12px; align-items: flex-start; }
  .dlg-ico { font-size: 1.8em; line-height: 1; }
  .dlg-top small { display: block; color: var(--text-2); font-size: 0.82em; margin-top: 3px; line-height: 1.4; }
  .dlg-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .pill-btn.ghost { background: var(--surface2); color: var(--text); }
  .pill-btn.ghost.done { background: var(--easy-soft); color: var(--easy); }
  .scene { font-size: 0.88em; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; line-height: 1.5; }
  .chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
  .bubble { max-width: 86%; padding: 10px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .bubble.me { align-self: flex-end; background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); border-bottom-right-radius: 6px; }
  .bubble.them { align-self: flex-start; border-bottom-left-radius: 6px; }
  .bubble.playing { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.02); }
  .bubble.turn { border: 2px dashed var(--accent); background: var(--surface); }
  .bubble .who { font-size: 0.7em; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .bubble .bit { font-weight: 600; line-height: 1.4; }
  .bubble .bcz { font-size: 0.84em; color: var(--text-2); margin-top: 3px; line-height: 1.4; }
  .bubble.turn .bcz { color: var(--text); font-size: 0.95em; margin-top: 0; }
  .rp-res { margin-top: 6px; font-size: 0.82em; color: var(--text-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .foot.sticky { position: sticky; bottom: 0; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--border); }
  .big-btn.on { background: var(--accent-soft); color: var(--accent); }
  .loop-btn.on { background: var(--accent) !important; color: #fff !important; }
  .role-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .rp-foot { flex-direction: column; gap: 10px; }
  .rp-status { text-align: center; font-size: 0.9em; color: var(--text-2); }
  .rp-btns { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .rp-btns .mic { width: 72px; height: 72px; font-size: 1.7em; margin: 0; flex-shrink: 0; }
  /* test */
  .test-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; margin-bottom: 14px; border-radius: var(--radius); background: var(--surface); border: 2px solid var(--accent); box-shadow: var(--shadow); }
  .test-btn.passed { border-color: var(--easy); }
  .test-btn .ti { font-size: 1.6em; }
  .test-btn small { display: block; color: var(--text-2); font-size: 0.8em; margin-top: 2px; }
  .test-btn .go { color: var(--accent); font-weight: 800; }
  .opts { display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .opt { padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface2); font-weight: 600; text-align: left; line-height: 1.35; }
  .opt.ok { border-color: var(--easy); background: var(--easy-soft); color: var(--easy); }
  .opt.bad { border-color: var(--hard); background: var(--hard-soft); color: var(--hard); }
  .blank { display: inline-block; min-width: 60px; border-bottom: 3px solid var(--accent); color: var(--accent); }
  .built { min-height: 56px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; padding: 10px; border-radius: 14px; border: 1.5px dashed var(--border); }
  .built.ok { border-color: var(--easy); background: var(--easy-soft); }
  .built.bad { border-color: var(--hard); background: var(--hard-soft); }
  .built-ph { color: var(--text-3); font-size: 0.85em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip { padding: 9px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); font-weight: 600; }
  .chip.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .chip:disabled { opacity: 0.25; }
  .fb { border-radius: 14px; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
  .fb.ok { background: var(--easy-soft); color: var(--easy); }
  .fb.bad { background: var(--hard-soft); color: var(--hard); }
  .fb-ans { color: var(--text); font-weight: 600; }
  .fb-ans small { color: var(--text-2); font-weight: 500; }
  .test-score { font-size: 3em; font-weight: 800; letter-spacing: -0.03em; margin: 10px 0; }
  .test-score.ok { color: var(--easy); } .test-score.bad { color: var(--hard); }
  .mistakes { display: flex; flex-direction: column; gap: 8px; text-align: left; padding-bottom: 10px; }
  .mistake { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--hard); border-radius: 12px; padding: 10px 12px; }
  .mistake .it { font-weight: 700; } .mistake .src { font-size: 0.82em; color: var(--text-2); margin-top: 2px; }
  .mistake .given { font-size: 0.8em; color: var(--hard); margin-top: 4px; }
  .sync-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
  .sync-code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.15em; font-weight: 700; letter-spacing: 0.02em; background: var(--surface2); border-radius: 12px; padding: 14px; text-align: center; word-break: break-all; user-select: all; }
  .sync-card .pill-btn { align-self: center; }
  .sync-p { font-size: 0.88em; color: var(--text-2); line-height: 1.5; }
  .sync-status { font-size: 0.88em; text-align: center; min-height: 1.3em; }
  .sync-btns { display: flex; gap: 10px; }
  .lesson.grammar .ico { background: var(--good-soft); }
  .gtag { color: var(--good); font-weight: 800; }
  .notes.gnotes { border-left-color: var(--good); }
  .notes.gnotes ul { font-size: 0.95em; }
  .empty { text-align: center; color: var(--text-2); padding: 40px 16px; font-size: 0.9em; line-height: 1.5; }

  /* ── LESSON ── */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .mode {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; text-align: left; box-shadow: var(--shadow); transition: transform .12s;
  }
  .mode:active { transform: scale(0.97); }
  .mode.first { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  .mode.first .mi { font-size: 1.8em; }
  .mode .mi { font-size: 1.4em; }
  .mode .mn { font-weight: 700; margin-top: 4px; }
  .mode.first .mn { margin-top: 0; }
  .mode .md { font-size: 0.76em; color: var(--text-2); margin-top: 2px; line-height: 1.35; }
  .mode .mp { font-size: 0.75em; font-weight: 700; color: var(--accent); margin-top: 8px; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 24px; font-size: 0.88em; }
  .switch { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--border); transition: background .2s; flex-shrink: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(18px); }

  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .list-head .section-title { margin: 0 2px; }
  .pill-btn { padding: 8px 14px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; font-size: 0.85em; }
  .phrase {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 12px 12px 14px; margin-bottom: 8px; transition: border-color .2s, background .2s;
  }
  .phrase.playing { border-color: var(--accent); background: var(--accent-soft); }
  .phrase .tx { flex: 1; min-width: 0; }
  .phrase .it { font-weight: 600; line-height: 1.35; }
  .phrase .src { font-size: 0.82em; color: var(--text-2); margin-top: 3px; line-height: 1.35; }
  .dots { display: flex; gap: 3px; margin-top: 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .dots i.easy { background: var(--easy); } .dots i.good { background: var(--good); } .dots i.hard { background: var(--hard); }
  .play { width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.95em; }
  .reset-link { display: block; margin: 20px auto 0; color: var(--text-3); font-size: 0.8em; text-decoration: underline; }

  /* ── SESSION ── */
  .session { display: flex; flex-direction: column; min-height: 100dvh; }
  .session .top { position: static; }
  .sbar { height: 4px; background: rgba(255,255,255,0.25); }
  .sbar > i { display: block; height: 100%; background: #fff; transition: width .3s; }
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px 0; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
    box-shadow: var(--shadow-lg); padding: 28px 22px; text-align: center; min-height: 260px;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
  }
  .card .lbl { font-size: 0.72em; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .card .big { font-size: 1.45em; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .card .hint { font-size: 0.88em; color: var(--text-2); background: var(--surface2); border-radius: 999px; padding: 5px 12px; align-self: center; }
  .card .mid { font-size: 1.05em; color: var(--text-2); line-height: 1.4; }
  .card hr { border: none; border-top: 1px dashed var(--border); margin: 4px 0; }
  .card .it-ans { font-size: 1.35em; font-weight: 700; color: var(--accent); line-height: 1.3; overflow-wrap: anywhere; }
  .audio-row { display: flex; justify-content: center; gap: 10px; }
  .audio-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 1.3em; display: flex; align-items: center; justify-content: center; }
  .audio-btn.lg { width: 84px; height: 84px; font-size: 2em; }
  .audio-btn.slow { font-size: 1.15em; }

  .write-in {
    width: 100%; font: inherit; font-size: 1.1em; padding: 14px; border-radius: 14px;
    border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); resize: none; outline: none;
  }
  .write-in:focus { border-color: var(--accent); }
  .accents { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .accents button { width: 38px; height: 34px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); font-weight: 600; }

  .mic {
    width: 88px; height: 88px; border-radius: 50%; margin: 0 auto;
    background: var(--accent); color: #fff; font-size: 2em; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .mic.rec { background: var(--accent-2); transition: box-shadow .08s linear; }
  .heard { min-height: 1.4em; color: var(--text-2); font-style: italic; }

  .diff { font-size: 1.1em; line-height: 1.6; }
  .diff .ok { color: var(--easy); font-weight: 600; }
  .diff .miss { color: var(--hard); font-weight: 600; text-decoration: underline wavy; text-underline-offset: 4px; }
  .score { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 0.85em; }
  .score.hi { background: var(--easy-soft); color: var(--easy); }
  .score.mid { background: var(--good-soft); color: var(--good); }
  .score.lo { background: var(--hard-soft); color: var(--hard); }
  .note { font-size: 0.8em; color: var(--warn); }

  .foot { padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); }
  .foot .wrap { display: flex; gap: 10px; }
  .big-btn { flex: 1; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 1em; background: var(--accent); color: #fff; }
  .big-btn.ghost { background: var(--surface2); color: var(--text); flex: 0 0 auto; padding: 16px 18px; }
  .rate { flex: 1; padding: 12px 6px; border-radius: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1.5px solid transparent; }
  .rate small { font-weight: 500; font-size: 0.72em; opacity: 0.8; }
  .rate.hard { background: var(--hard-soft); color: var(--hard); border-color: color-mix(in srgb, var(--hard) 30%, transparent); }

const STORE_KEY = 'lv2-progress';
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.cards) { s.tests ||= {}; s.dialogs ||= {}; return s; }
  } catch {}
  return { cards: {}, points: 0, days: [], tests: {}, dialogs: {} };
}

function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {} scheduleSync(); }

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function rate(phraseId, mode, rating) {
  (store.cards[phraseId] ||= {})[mode] = rating;
  (store.ts ||= {})[phraseId] = Date.now();
  store.points += RATING_POINTS[rating];
  const t = today();
  if (!store.days.includes(t)) store.days.push(t);
  saveStore();
}
function getRating(phraseId, mode) { return store.cards[phraseId]?.[mode] || null; }

function streak() {
  const set = new Set(store.days);
  const d = new Date();
  const key = () => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  if (!set.has(key())) d.setDate(d.getDate() - 1); // dnešek se ještě může dohnat
  let n = 0;
  while (set.has(key())) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function modeProgress(lesson, mode) {
  if (!lesson.phrases.length) return 0;
  const sum = lesson.phrases.reduce((a, p) => a + (RATING_POINTS[getRating(p.id, mode)] || 0), 0);
  return Math.round(sum / (lesson.phrases.length * 3) * 100);
}
function lessonProgress(lesson) {
  return Math.round(MODES.reduce((a, m) => a + modeProgress(lesson, m.id), 0) / MODES.length);
}
function masteredCount() {
  // fráze ohodnocená jako "easy" ve všech režimech
  return LESSONS.flatMap(l => l.phrases).filter(p => MODES.every(m => getRating(p.id, m.id) === 'easy')).length;
}

// ═══════════════════════════════════════════════════════════
//  AUDIO — předgenerované MP3 (Gemini TTS) v audio/<klíč>.mp3
//  Hraje jeden <audio> přehrávač → běží i na pozadí a se zamčeným iPhonem.
//  Když nahrávka chybí, mluví hlas prohlížeče (speechSynthesis).
// ═══════════════════════════════════════════════════════════
const AUDIO_BASE = 'audio/';
const VOICE_IT = 'Puck', VOICE_SRC = 'Kore';
const CAST_VOICE = { Bob: 'Puck', Giulia: 'Kore', Anna: 'Aoede', Marco: 'Charon', Luca: 'Fenrir', Signora: 'Leda' };
let clipSet = new Set();
fetch(AUDIO_BASE + 'index.json').then(r => r.json()).then(a => { clipSet = new Set(a); }).catch(() => {});

// FNV-1a 64bit — stejná funkce generuje názvy souborů
function clipKey(voice, text) {
  let h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x5bd1e995;
  const s = voice + '|' + text;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 ^ c, 0x5bd1e995) >>> 0;
  }
  return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}
function clipUrl(voice, text) {
  const k = clipKey(voice, text);
  return clipSet.has(k) ? AUDIO_BASE + k + '.mp3' : null;
}

const player = new Audio();
player.preload = 'auto';
let playerDone = null; // resolve právě hrající nahrávky (stopSpeech ji ukončí)
function playUrl(url, rate = 1) {
  return new Promise(resolve => {
    if (playerDone) playerDone();
    let finished = false;
    const done = () => { if (finished) return; finished = true; if (playerDone === done) playerDone = null; resolve(); };
    playerDone = done;
    player.onended = done; player.onerror = done;
    player.src = url;
    player.playbackRate = rate;
    player.preservesPitch = true;
    player.play().catch(done);
  });
}
// iOS pustí zvuk jen po klepnutí – první dotyk přehrávač „odemkne“
document.addEventListener('touchend', function unlock() {
  document.removeEventListener('touchend', unlock);
  if (player.src) return;
  player.src = AUDIO_BASE + 'silence-400.mp3';
  player.play().catch(() => {});
}, { once: true });

// pauza: na pozadí jako tichá nahrávka (časovače iOS uspí), jinak obyčejné čekání
function gap(ms) {
  if (!clipSet.size) return pause(ms);
  const f = [400, 500, 900, 1500].reduce((a, b) => Math.abs(b - ms) < Math.abs(a - ms) ? b : a);
  return playUrl(`${AUDIO_BASE}silence-${f}.mp3`);
}

// ovládání na zamčené obrazovce (název lekce, ▶ ⏸ ⏭)
function mediaSession(title, { onPlay, onPause, onNext } = {}) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title, artist: 'Bobik Speaks Italian', album: '🇮🇹 Italština', artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] });
    navigator.mediaSession.setActionHandler('play', onPlay || null);
    navigator.mediaSession.setActionHandler('pause', onPause || null);
    navigator.mediaSession.setActionHandler('nexttrack', onNext || null);
  } catch {}
}

let speakGen = 0;
function speak(text, lang = 'it-IT', rate = 0.95, opts = {}) {
  const url = clipUrl(opts.voiceName || (lang === 'it-IT' ? VOICE_IT : VOICE_SRC), text);
  if (url) return playUrl(url, rate / 0.95);
  return new Promise(resolve => {
    if (!synth) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = rate;
    if (opts.pitch) u.pitch = opts.pitch;
    const v = opts.voice || (lang === 'it-IT' ? itVoice : null);
    if (v) u.voice = v;
    u.onend = resolve; u.onerror = resolve;
    synth.speak(u);
  });
}
function stopSpeech() { speakGen++; if (synth) synth.cancel(); player.pause(); if (playerDone) playerDone(); }
function sayIt(text, slow = false) { stopSpeech(); return speak(text, 'it-IT', slow ? 0.65 : 0.95); }
const pause = ms => new Promise(r => setTimeout(r, ms));

//  POROVNÁNÍ ODPOVĚDI (Write it / Say it)
// ═══════════════════════════════════════════════════════════
const stripAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const tokens = s => s.replace(/[’`]/g, "'").replace(/[.,!?;:"«»()¿¡…–\/-]/g, ' ').replace(/'/g, "' ").split(/\s+/).filter(Boolean);

// "Mio / Mia" = stačí jedna z variant (nebo obě) → bere se nejlepší shoda
function compare(expected, given) {
  const variants = expected.includes('/') ? [...expected.split('/').map(v => v.trim()).filter(Boolean), expected] : [expected];
  return variants.map(v => compareOne(v, given)).reduce((best, x) => (x.score > best.score ? x : best));
}

function compareOne(expected, given) {
  const exp = tokens(expected), giv = tokens(given);
  const norm = w => stripAcc(w.toLowerCase());
  const e = exp.map(norm), g = giv.map(norm);
  // LCS na slovech (bez diakritiky)
  const dp = Array.from({ length: e.length + 1 }, () => new Array(g.length + 1).fill(0));
  for (let i = e.length - 1; i >= 0; i--)
    for (let j = g.length - 1; j >= 0; j--)
      dp[i][j] = e[i] === g[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const matched = new Array(e.length).fill(false);
  let accentIssue = false;
  for (let i = 0, j = 0; i < e.length && j < g.length;) {
    if (e[i] === g[j]) { matched[i] = true; if (exp[i].toLowerCase() !== giv[j].toLowerCase()) accentIssue = true; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
    else j++;
  }
  const hits = matched.filter(Boolean).length;
  const extra = Math.max(0, g.length - hits);
  const score = e.length ? Math.max(0, Math.round((hits - extra * 0.5) / e.length * 100)) : 0;
  return { words: exp.map((w, i) => ({ w, ok: matched[i] })), score, accentIssue };
}
function diffHtml(res) {
  return res.words.map((x, i) => `<span class="${x.ok ? 'ok' : 'miss'}">${esc(x.w)}</span>` + (x.w.endsWith("'") || i === res.words.length - 1 ? '' : ' ')).join('');
}
function scoreBadge(score) {
  const cls = score >= 90 ? 'hi' : score >= 60 ? 'mid' : 'lo';
  return `<span class="score ${cls}">${score} %</span>`;
}
function suggestRating(score) { return score >= 90 ? 'easy' : score >= 60 ? 'good' : 'hard'; }

          return `<button class="lesson${isNext ? ' next' : ''}${l.grammar ? ' grammar' : ''}" data-go="#/l/${encodeURIComponent(l.id)}">
            <div class="ico">${l.icon || '📘'}</div>
            <div class="meta">
              <div class="num">LEKCE ${lessonNumber(l)}${l.grammar ? ' · <span class="gtag">GRAMATIKA</span>' : ''}${isNext ? '<span class="next-badge">Pokračuj tady</span>' : ''}</div>
              <div class="t">${esc(l.title)}</div>
              <div class="d">${l.phrases.length} ${phraseWord(l.phrases.length)}</div>
              <div class="bar"><i style="width:${pct}%"></i></div>
            </div>
            <div class="pct">${testPassed(l) ? '<span title="Test splněn">✅</span><br>' : ''}${pct} %</div>
          </button>`;
        }).join('');
      }).join('') || `<div class="empty">Zatím žádné lekce.</div>`}
    </div></main>`;
  bindGo();
}

let S = null; // { lesson, mode, queue, idx, revealed, results, requeued, check }

function startSession(lesson, mode, only = null) {
  let pool = lesson.phrases;
  if (only) pool = pool.filter(p => only.includes(p.id));
  else if (hardOnly) {
    const f = pool.filter(p => getRating(p.id, mode) !== 'easy');
    pool = f.length ? f : pool;
  }
  S = { lesson, mode, queue: shuffle(pool), idx: 0, revealed: false, results: {}, requeued: new Set(), check: null };
  document.title = `${findMode(mode).name} · ${lesson.title}`;
  renderCard();
}

function renderCard() {
  const { lesson, mode, queue, idx } = S;
  if (idx >= queue.length) return renderSummary();
  const p = queue[idx];
  const m = findMode(mode);
  const done = Object.keys(S.results).length;
  const total = new Set(queue.map(q => q.id)).size;
  S.revealed = false; S.check = null;
  if (S.myAudio) { URL.revokeObjectURL(S.myAudio); S.myAudio = null; }

  app.innerHTML = `
    <div class="session">
      <header class="top"><div class="wrap">
        <button class="icon-btn" data-go="#/l/${encodeURIComponent(lesson.id)}" aria-label="Zavřít">✕</button>
        <div style="flex:1;min-width:0">
          <h1>${m.icon} ${m.name}</h1>
          <div class="sub">${esc(lesson.title)}</div>
        </div>
        <div class="sub" style="font-weight:700;color:#fff">${Math.min(done + 1, total)} / ${total}</div>
      </div><div class="sbar"><i style="width:${done / total * 100}%"></i></div></header>
      <div class="stage"><div class="wrap"><div class="card" id="card">${promptHtml(p, mode)}</div></div></div>
      <div class="foot"><div class="wrap" id="foot"></div><div class="kbd-hint" id="kbd"></div></div>
    </div>`;
  bindGo();
  renderFoot();
  wirePrompt(p, mode);
}

function promptHtml(p, mode) {
  const srcBlock = `<div class="lbl">${flag(p)} Jak se řekne italsky?</div><div class="big">${esc(p.src)}</div>${p.hint ? `<div class="hint">💡 ${esc(p.hint)}</div>` : ''}`;
  switch (mode) {
    case 'reveal': return srcBlock;
    case 'hear': return `
      <div class="lbl">🎧 Poslouchej</div>
      <div class="audio-row">
        <button class="audio-btn lg" data-say="0" aria-label="Přehrát">🔊</button>
        <button class="audio-btn slow" data-say="1" aria-label="Pomalu" style="align-self:center">🐢</button>
      </div>
      <div class="mid">Co to znamená?</div>`;
    case 'know': return `<div class="lbl">🇮🇹 Co to znamená?</div><div class="big">${esc(p.it)}</div>`;
    case 'write': return `${srcBlock}
      <textarea class="write-in" id="answer" rows="2" lang="it" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Napiš italsky…"></textarea>
      <div class="accents">${['à', 'è', 'é', 'ì', 'ò', 'ù'].map(c => `<button data-acc="${c}">${c}</button>`).join('')}</div>`;
    case 'say': return `${srcBlock}
      <button class="mic" id="mic" aria-label="Mluvit">🎤</button>
      <div class="heard" id="heard">Klepni a řekni to italsky</div>`;
  }
}

function wirePrompt(p, mode) {
  app.querySelectorAll('[data-say]').forEach(b => b.onclick = () => sayIt(p.it, b.dataset.say === '1'));
  if (mode === 'hear') setTimeout(() => S && !S.revealed && sayIt(p.it), 250);
  if (mode === 'write') {
    const ta = document.getElementById('answer');
    setTimeout(() => ta.focus(), 50);
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); checkWritten(); } });
    app.querySelectorAll('[data-acc]').forEach(b => {
      b.onmousedown = e => e.preventDefault(); // nechat focus v textarea
      b.onclick = () => {
        const s = ta.selectionStart, eIdx = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + b.dataset.acc + ta.value.slice(eIdx);
        ta.selectionStart = ta.selectionEnd = s + 1; ta.focus();
      };
    });
  }
  if (mode === 'say') document.getElementById('mic').onclick = () => toggleRecognition(p);
}

function renderFoot() {
  const foot = document.getElementById('foot');
  const kbd = document.getElementById('kbd');
  if (!S.revealed) {
    if (S.mode === 'write') {
      foot.innerHTML = `<button class="big-btn ghost" id="dunno">Nevím</button><button class="big-btn" id="checkBtn">Zkontrolovat</button>`;
      document.getElementById('checkBtn').onclick = checkWritten;
      document.getElementById('dunno').onclick = () => reveal();
      kbd.textContent = 'Enter = zkontrolovat';
    } else {
      foot.innerHTML = `<button class="big-btn" id="revealBtn">Odkrýt</button>`;
      document.getElementById('revealBtn').onclick = () => reveal();
      kbd.textContent = 'Mezerník = odkrýt';
    }
  } else {
    const sug = S.check ? suggestRating(S.check.score) : null;
    foot.innerHTML = ['hard', 'good', 'easy'].map(r => `
      <button class="rate ${r}" data-rate="${r}" ${sug === r ? 'style="border-width:2.5px;border-color:currentColor"' : ''}>
        ${{ hard: 'Hard', good: 'Good', easy: 'Easy' }[r]}<small>${{ hard: 'Znovu', good: 'Skoro', easy: 'Umím' }[r]}</small>
      </button>`).join('');
    foot.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => rateCard(b.dataset.rate));
    kbd.textContent = '1 = Hard · 2 = Good · 3 = Easy';
  }
}

function reveal() {
  if (S.revealed) return;
  stopRecognition();
  const p = S.queue[S.idx];
  S.revealed = true;
  const card = document.getElementById('card');
  const audio = `<div class="audio-row"><button class="audio-btn" data-say="0" aria-label="Přehrát">🔊</button><button class="audio-btn slow" data-say="1" aria-label="Pomalu">🐢</button></div>`;
  let checkHtml = '';
  if (S.check) {
    checkHtml = `<div>${scoreBadge(S.check.score)}</div>
      ${S.check.given ? `<div class="mid" style="font-size:0.9em">Tvoje: „${esc(S.check.given)}“</div>` : ''}
      ${S.check.score < 100 ? `<div class="diff">${diffHtml(S.check)}</div>` : ''}
      ${S.check.accentIssue && S.mode === 'write' ? '<div class="note">Pozor na přízvuky (à è é ì ò ù)</div>' : ''}<hr>`;
  }
  switch (S.mode) {
    case 'reveal':
      card.innerHTML = `<div class="lbl">${flag(p)}</div><div class="mid">${esc(p.src)}</div><hr><div class="it-ans">${esc(p.it)}</div>${audio}`;
      break;
    case 'hear':
    case 'know':
      card.innerHTML = `<div class="lbl">🇮🇹</div><div class="it-ans">${esc(p.it)}</div>${audio}<hr><div class="lbl">${flag(p)} Význam</div><div class="big" style="font-size:1.2em">${esc(p.src)}</div>`;
      break;
    case 'write':
    case 'say':
      card.innerHTML = `<div class="mid">${flag(p)} ${esc(p.src)}</div><hr>${checkHtml}<div class="it-ans">${esc(p.it)}</div>${audio}${S.mode === 'say' && S.myAudio ? '<button class="pill-btn" id="myRec" style="align-self:center;background:var(--surface2);color:var(--text)">▶ Moje nahrávka</button>' : ''}`;
      break;
  }
  app.querySelectorAll('[data-say]').forEach(b => b.onclick = () => sayIt(p.it, b.dataset.say === '1'));
  if (S.mode !== 'hear') sayIt(p.it);
  const myRec = document.getElementById('myRec');
  if (myRec) myRec.onclick = () => { stopSpeech(); new Audio(S.myAudio).play(); };
  renderFoot();
}

function checkWritten() {
  const ta = document.getElementById('answer');
  const given = ta ? ta.value.trim() : '';
  if (!given) return reveal();
  const p = S.queue[S.idx];
  S.check = { ...compare(p.it, given), given };
  reveal();
}

function rateCard(r) {
  if (!S || !S.revealed) return;
  const p = S.queue[S.idx];
  rate(p.id, S.mode, r);
  S.results[p.id] = r; // poslední hodnocení se počítá
  if (r === 'hard' && !S.requeued.has(p.id)) { S.requeued.add(p.id); S.queue.push(p); }
  S.idx++;
  stopSpeech();
  renderCard();
}

function renderSummary() {
  const { lesson, mode } = S;
  const vals = Object.values(S.results);
  const c = { easy: 0, good: 0, hard: 0 };
  vals.forEach(v => c[v]++);
  const pts = vals.reduce((a, v) => a + RATING_POINTS[v], 0);
  const hardIds = Object.keys(S.results).filter(id => S.results[id] !== 'easy');
  const pct = vals.length ? Math.round(pts / (vals.length * 3) * 100) : 0;
  const m = findMode(mode);
  app.innerHTML = `
    <div class="session">
      <header class="top"><div class="wrap">
        <button class="icon-btn" data-go="#/l/${encodeURIComponent(lesson.id)}" aria-label="Zavřít">✕</button>
        <h1>${m.icon} ${m.name}</h1>
      </div><div class="sbar"><i style="width:100%"></i></div></header>
      <div class="stage"><div class="wrap summary">
        <div class="trophy">${pct >= 85 ? '🏆' : pct >= 60 ? '💪' : '🌱'}</div>
        <h2>${pct >= 85 ? 'Bravissimo!' : pct >= 60 ? 'Bene!' : 'Avanti così!'}</h2>
        <p>${esc(lesson.title)} · ${m.name} · +${pts} bodů</p>
        <div class="sum-grid">
          <div class="e"><b>${c.easy}</b>Easy</div>
          <div class="g"><b>${c.good}</b>Good</div>
          <div class="h"><b>${c.hard}</b>Hard</div>
        </div>
      </div></div>
      <div class="foot"><div class="wrap">
        ${hardIds.length ? `<button class="big-btn ghost" id="again" style="flex:1">Zopakovat ${hardIds.length} slabší</button>` : ''}
        <button class="big-btn" data-go="#/l/${encodeURIComponent(lesson.id)}">Hotovo</button>
      </div></div>
    </div>`;
  bindGo();
  const again = document.getElementById('again');
  if (again) again.onclick = () => startSession(lesson, mode, hardIds);
  S.finished = true;
}

// ═══════════════════════════════════════════════════════════
//  NAHRÁVÁNÍ → přepis přes Worker (Whisper)
//  (Web Speech API na iPhonu z plochy nefunguje, MediaRecorder ano)
//  Používá Say it i hraní rolí v konverzaci.
// ═══════════════════════════════════════════════════════════
const TRANSCRIBE_URL = 'https://flat-paper-f764.itsbobik.workers.dev/transcribe?lang=it';
const MAX_REC_MS = 15000;
let rec = null; // { mr, stream, chunks, timer, cancelled, ctx, vad, mic }

// Detekce ticha: po začátku řeči stačí ~1,2 s ticha a nahrávání se samo ukončí
const VAD = { calibrateMs: 300, minSpeechMs: 150, silenceMs: 1200, noSpeechMs: 7000, tickMs: 50 };

function stopRecognition(cancel = true) {
  if (!rec) return;
  const r = rec; rec = null;
  r.cancelled = cancel;
  clearTimeout(r.timer);
  clearInterval(r.vad);
  if (r.ctx) r.ctx.close().catch(() => {});
  try { if (r.mr.state !== 'inactive') r.mr.stop(); } catch {}
  r.stream.getTracks().forEach(t => t.stop()); // uvolnit mikrofon (jinak iOS ztlumí přehrávání)
  if (r.mic) { r.mic.classList.remove('rec'); r.mic.textContent = '🎤'; r.mic.style.boxShadow = ''; }
}

function startVad(r, onSpeechEnd, onNoSpeech) {
  try {
    const src = r.ctx.createMediaStreamSource(r.stream);
    const an = r.ctx.createAnalyser();
    an.fftSize = 1024;
    src.connect(an);
    if (r.ctx.state === 'suspended') r.ctx.resume();
    const buf = new Uint8Array(an.fftSize);
    let t = 0, floorSum = 0, floorN = 0, threshold = 0.02, loudMs = 0, quietMs = 0, started = false;
    r.vad = setInterval(() => {
      an.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      t += VAD.tickMs;
      if (r.mic) r.mic.style.boxShadow = `0 0 0 ${Math.min(26, Math.round(rms * 260))}px color-mix(in srgb, var(--accent) 22%, transparent)`;
      if (t <= VAD.calibrateMs) { // hladina šumu v místnosti
        floorSum += rms; floorN++;
        threshold = Math.max(0.02, (floorSum / floorN) * 2.5);
        return;
      }
      if (rms > threshold) { loudMs += VAD.tickMs; quietMs = 0; if (loudMs >= VAD.minSpeechMs) started = true; }
      else { loudMs = 0; if (started) quietMs += VAD.tickMs; }
      if (started && quietMs >= VAD.silenceMs) onSpeechEnd();
      else if (!started && t >= VAD.noSpeechMs) onNoSpeech();
    }, VAD.tickMs);
  } catch { /* bez VAD zůstane ruční stop */ }
}

function pickMime() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  return ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported(t)) || '';
}

// Klepnutí na mikrofon: start, nebo (podruhé) stop a vyhodnocení.
// valid() = je obrazovka pořád ta samá? onBlob(blob) dostane hotovou nahrávku.
async function startRecording({ mic, status, valid, onBlob }) {
  if (rec) { stopRecognition(false); return; }
  if (mic.disabled) return;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    status.textContent = 'Tento prohlížeč neumí nahrávat – řekni to nahlas a odkryj.'; return;
  }
  stopSpeech();
  // AudioContext vytvořit hned v klepnutí (iOS ho jinak nechá uspaný)
  let ctx = null;
  try { ctx = new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {}
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch { if (ctx) ctx.close().catch(() => {}); status.textContent = 'Přístup k mikrofonu zamítnut – povol ho v nastavení.'; return; }
  if (!valid()) { stream.getTracks().forEach(t => t.stop()); if (ctx) ctx.close().catch(() => {}); return; }

  const mime = pickMime();
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const r = { mr, stream, chunks: [], cancelled: false, timer: null, ctx, vad: null, mic };
  mr.ondataavailable = e => { if (e.data && e.data.size) r.chunks.push(e.data); };
  mr.onstop = () => {
    if (rec === r) stopRecognition(false); // auto-stop (časový limit)
    if (r.cancelled || !valid()) return;
    const blob = new Blob(r.chunks, { type: mr.mimeType || mime || 'audio/mp4' });
    if (blob.size < 1500) { status.textContent = 'Nahrávka je moc krátká – zkus to znovu.'; return; }
    onBlob(blob);
  };
  rec = r;
  mr.start();
  r.timer = setTimeout(() => { if (rec === r) stopRecognition(false); }, MAX_REC_MS);
  mic.classList.add('rec'); mic.textContent = '⏹';
  status.textContent = 'Mluv… až domluvíš, samo se to zastaví';
  if (ctx) startVad(r,
    () => { if (rec === r) stopRecognition(false); },
    () => { if (rec === r) { stopRecognition(true); status.textContent = 'Nic jsem neslyšel – klepni a zkus to znovu.'; } });
  else status.textContent = 'Nahrávám… klepni znovu, až domluvíš';
}

async function transcribe(blob) {
  const res = await fetch(TRANSCRIBE_URL, { method: 'POST', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || res.status);
  return (data.text || '').trim();
}

// ── Say it ──
function toggleRecognition(p) {
  const valid = () => S && !S.revealed && S.queue[S.idx] === p;
  startRecording({ mic: document.getElementById('mic'), status: document.getElementById('heard'), valid, onBlob: blob => sendForTranscription(p, blob, valid) });
}

async function sendForTranscription(p, blob, valid) {
  const heard = document.getElementById('heard');
  const mic = document.getElementById('mic');
  if (S.myAudio) URL.revokeObjectURL(S.myAudio);
  S.myAudio = URL.createObjectURL(blob);
  mic.disabled = true; mic.style.opacity = '0.5';
  heard.textContent = 'Vyhodnocuju…';
  try {
    const text = await transcribe(blob);
    if (!valid()) return;
    if (!text) { heard.textContent = 'Nic jsem neslyšel – zkus to znovu.'; return; }
    S.check = { ...compare(p.it, text), given: text };
    reveal();
  } catch (e) {
    if (valid()) heard.textContent = 'Nepodařilo se vyhodnotit (' + (e.message || 'chyba sítě') + '). Zkus to znovu.';
  } finally {
    if (mic && document.body.contains(mic)) { mic.disabled = false; mic.style.opacity = ''; }
  }
}

let dlgGen = 0;
let dlgShowCz = true;
try { dlgShowCz = localStorage.getItem('lv2-dlg-cz') !== '0'; } catch {}

// dvě postavy = dva hlasy (když jsou k dispozici), jinak jiná výška hlasu
function speakAs(cast, who, text, slow = false) {
  const keys = Object.keys(cast);
  const i = Math.max(0, keys.indexOf(who));
  const voices = synth ? synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('it')) : [];
  const voice = voices.length > 1 ? voices[i % voices.length] : itVoice;
  return speak(text, 'it-IT', slow ? 0.7 : 0.95, { voice, pitch: voices.length > 1 ? 1 : (i ? 1.25 : 0.9), voiceName: CAST_VOICE[cast[who]] });
}

function bubbleHtml(d, ln, idx, side = ln.s === Object.keys(d.cast)[0] ? 'me' : 'them', extra = '') {
  return `<div class="bubble ${side}" id="ln-${idx}" data-line="${idx}">
    <div class="who">${esc(d.cast[ln.s])}</div>
    <div class="bit">${esc(ln.it)}</div>
    <div class="bcz"${dlgShowCz ? '' : ' hidden'}>${esc(ln.cz)}</div>${extra}

}

function dialogHeader(lesson, d, sub) {

function renderDialog(lesson, di) {
  const d = lesson.dialogs[di];
  const nextD = lesson.dialogs[di + 1];
  dlgGen++;
  document.title = `${d.title} · ${lesson.title}`;
  app.innerHTML = `<div class="session">
    ${dialogHeader(lesson, d, (lesson.dialogs.length > 1 ? `Konverzace ${di + 1}/${lesson.dialogs.length} · ` : 'Konverzace · ') + lesson.title)}
    <main style="flex:1"><div class="wrap">

      <button class="big-btn ghost" id="czBtn">${dlgShowCz ? '🇨🇿 Skrýt' : '🇨🇿 Ukázat'}</button>

    </div>
  </div>`;
  bindGo();
  let slow = false;
  const playBtn = document.getElementById('playDlg');
  const mark = i => { app.querySelectorAll('.bubble.playing').forEach(b => b.classList.remove('playing')); const el = document.getElementById(`ln-${i}`); if (el) { el.classList.add('playing'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } };
  const stop = () => { dlgGen++; stopSpeech(); speechKeepAwake(false); app.querySelectorAll('.bubble.playing').forEach(b => b.classList.remove('playing')); playBtn.textContent = '▶ Přehrát'; delete playBtn.dataset.on; };
  playBtn.onclick = async () => {
    if (playBtn.dataset.on) return stop();
    stopSpeech();
    const g = ++dlgGen;
    playBtn.dataset.on = '1'; playBtn.textContent = '⏸ Zastavit';
    mediaSession(`${d.title} · ${lesson.title}`, { onPause: () => playBtn.dataset.on && stop(), onPlay: () => !playBtn.dataset.on && playBtn.click(), onNext: () => { player.pause(); if (playerDone) playerDone(); } });
    speechKeepAwake(true);
    do {
      for (let i = 0; i < d.lines.length && g === dlgGen; i++) {
        mark(i);
        await speakAs(d.cast, d.lines[i].s, d.lines[i].it, slow);
        if (g !== dlgGen) return;

const rpKey = (lesson, di, who) => `${lesson.id}:${di}:${who}`;
function rpBest(lesson, di, who) { return store.dialogs?.[rpKey(lesson, di, who)] ?? null; }
function roleBtn(lesson, di, k, name, cls = 'pill-btn ghost') {

}

let R = null; // { lesson, d, di, me, idx, scores, gen }

function startRoleplay(lesson, di, me) {
  const d = lesson.dialogs[di];
  R = { lesson, d, di, me, idx: 0, scores: [], gen: ++dlgGen };
  document.title = `Hraj za ${d.cast[me]} · ${lesson.title}`;
  app.innerHTML = `<div class="session">
    ${dialogHeader(lesson, d, `Hraješ za ${d.cast[me]}`)}
    <main style="flex:1"><div class="wrap">
      <div class="scene">${esc(d.scene)} Ty jsi <b>${esc(d.cast[me])}</b> – appka mluví za ostatní. Až budeš na řadě, řekni svou repliku italsky.</div>
      <div class="chat" id="chat"></div>
    </div></main>
    <div class="foot sticky"><div class="wrap rp-foot" id="rpFoot"></div></div>

function rpChatAppend(html) {
  const chat = document.getElementById('chat');
  chat.insertAdjacentHTML('beforeend', html);
  chat.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return chat.lastElementChild;
}

async function rpStep() {
  if (!R) return;
  const g = R.gen, d = R.d;
  const foot = document.getElementById('rpFoot');
  if (R.idx >= d.lines.length) return rpSummary();
  const ln = d.lines[R.idx];
  if (ln.s !== R.me) {
    foot.innerHTML = `<div class="rp-status">🔊 ${esc(d.cast[ln.s])} mluví…</div>`;
    const el = rpChatAppend(bubbleHtml(d, ln, R.idx, 'them playing'));
    await speakAs(d.cast, ln.s, ln.it);
    if (!R || g !== R.gen) return;
    el.classList.remove('playing');
    el.onclick = () => speakAs(d.cast, ln.s, ln.it);
    await pause(350);
    if (!R || g !== R.gen) return;
    R.idx++;
    return rpStep();
  }
  // tvoje řada
  const lineIdx = R.idx;
  const el = rpChatAppend(`<div class="bubble me turn" id="ln-${lineIdx}">
    <div class="who">${esc(d.cast[R.me])} · tvoje řada</div>
    <div class="bcz">🇨🇿 ${esc(ln.cz)}</div>
    <div class="bit" hidden></div>
  </div>`);
  foot.innerHTML = `
    <div class="rp-status" id="rpStatus">Řekni to italsky 👇</div>
    <div class="rp-btns">
      <button class="big-btn ghost" id="rpReveal">Odkrýt</button>
      <button class="mic" id="rpMic" aria-label="Mluvit">🎤</button>
      <button class="big-btn ghost" id="rpHint">💡</button>
    </div>`;
  const valid = () => R && g === R.gen && R.idx === lineIdx;
  const finish = (given, score) => {
    if (!valid()) return;
    stopRecognition();
    R.scores.push(score);
    const bit = el.querySelector('.bit');
    bit.hidden = false;
    bit.textContent = ln.it;
    el.classList.remove('turn');
    if (given !== null) el.insertAdjacentHTML('beforeend', `<div class="rp-res">${scoreBadge(score)} <span>„${esc(given)}“</span></div>`);
    else el.insertAdjacentHTML('beforeend', `<div class="rp-res"><span class="score lo">odkryto</span></div>`);
    el.onclick = () => speakAs(d.cast, ln.s, ln.it);
    foot.innerHTML = `<div class="rp-btns"><button class="big-btn ghost" id="rpAgain">🔁 Znovu</button><button class="big-btn" id="rpNext">Pokračovat ▶</button></div>`;
    document.getElementById('rpAgain').onclick = () => {
      R.scores.pop(); el.remove(); rpStep();
    };
    document.getElementById('rpNext').onclick = () => { stopSpeech(); R.idx++; rpStep(); };
    speakAs(d.cast, ln.s, ln.it);
  };
  document.getElementById('rpReveal').onclick = () => finish(null, 0);
  document.getElementById('rpHint').onclick = e => {
    const words = ln.it.split(/\s+/);
    document.getElementById('rpStatus').textContent = '💡 ' + words.slice(0, Math.max(1, Math.ceil(words.length / 3))).join(' ') + ' …';
    e.currentTarget.disabled = true;
  };
  const mic = document.getElementById('rpMic');
  const status = document.getElementById('rpStatus');
  mic.onclick = () => startRecording({
    mic, status, valid,
    onBlob: async blob => {
      mic.disabled = true; mic.style.opacity = '0.5';
      status.textContent = 'Vyhodnocuju…';
      try {
        const text = await transcribe(blob);
        if (!valid()) return;
        if (!text) { status.textContent = 'Nic jsem neslyšel – zkus to znovu.'; return; }
        finish(text, compare(ln.it, text).score);
      } catch (e) {
        if (valid()) status.textContent = 'Nepodařilo se vyhodnotit (' + (e.message || 'chyba sítě') + '). Zkus to znovu.';
      } finally {
        if (document.body.contains(mic)) { mic.disabled = false; mic.style.opacity = ''; }
      }
    },
  });
}

function rpSummary() {
  const { lesson, d, di, me, scores } = R;
  const nextD = lesson.dialogs[di + 1];
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
  const other = Object.keys(d.cast).find(k => k !== me);
  const t = today();
  if (!store.days.includes(t)) { store.days.push(t); }
  store.points += Math.round(avg / 10);
  const prev = rpBest(lesson, di, me);
  store.dialogs ||= {};
  if (scores.length && (prev === null || avg > prev)) store.dialogs[rpKey(lesson, di, me)] = avg;
  saveStore();
  document.getElementById('rpFoot').innerHTML = `
    <div class="rp-status"><b>${avg >= 85 ? '🏆 Bravissimo!' : avg >= 60 ? '💪 Bene!' : '🌱 Avanti così!'}</b> Průměr tvých replik: ${scoreBadge(avg)}<br><small>${prev !== null && avg > prev ? `Nový rekord! (dřív ${prev} %)` : prev !== null ? `Nejlepší výsledek: ${Math.max(prev, avg)} %` : 'Výsledek uložen'}</small></div>
    <div class="rp-btns">
      <button class="big-btn ghost" data-go="#/l/${encodeURIComponent(lesson.id)}">Hotovo</button>
      <button class="big-btn ghost" id="rpRestart">🔁 Znovu</button>
      ${other ? `<button class="big-btn${nextD ? ' ghost' : ''}" data-go="#/l/${encodeURIComponent(lesson.id)}/dialog/${di}/${other}">Hraj za ${esc(d.cast[other])}</button>` : ''}
      ${nextD ? `<button class="big-btn" data-go="#/l/${encodeURIComponent(lesson.id)}/dialog/${di + 1}">Další ▶</button>` : ''}
    </div>`;
  bindGo();
  document.getElementById('rpRestart').onclick = () => startRoleplay(lesson, di, me);
}

// ═══════════════════════════════════════════════════════════
//  TEST LEKCE — jako ve škole, 80 % = splněno
//  #/l/ID/test
// ═══════════════════════════════════════════════════════════
const TEST_PASS = 80;
let T = null; // { lesson, qs, idx, answered, correct, mistakes }

function testBest(lesson) { return store.tests?.[lesson.id] ?? null; }
function testPassed(lesson) { const b = testBest(lesson); return b !== null && b >= TEST_PASS; }

const normTxt = s => stripAcc(String(s).toLowerCase()).replace(/[’`]/g, "'").replace(/[.,!?;:"«»()¿¡…–]/g, '').replace(/\s+/g, ' ').trim();
const chipWords = s => s.replace(/[.,!?;:"«»()¿¡…–]/g, ' ').split(/\s+/).filter(Boolean);

function distractorPool(lesson) {
  const o = orderedLessons();
  const i = o.indexOf(lesson);
  let pool = o.slice(Math.max(0, i - 3), i + 1).flatMap(l => l.phrases);
  if (pool.length < 12) pool = o.slice(0, Math.max(i + 3, 6)).flatMap(l => l.phrases);
  return pool;
}

function pickDistractors(correct, cands, key, n = 3) {
  const seen = new Set([normTxt(correct[key]), normTxt(correct.it)]);
  const out = [];
  for (const c of shuffle(cands)) {
    const k = normTxt(c[key]);
    if (seen.has(k) || seen.has(normTxt(c.it))) continue;
    seen.add(k); seen.add(normTxt(c.it));
    out.push(c[key]);
    if (out.length >= n) break;
  }
  return out;
}

function clozeOf(p) {
  const words = p.it.split(/\s+/);
  if (words.length < 2) return null;
  const cands = words.map((w, i) => ({ w, i, core: w.replace(/[.,!?;:"«»()¿¡…–]/g, '') }))
    .filter(x => x.core.replace(/^[a-z]+'/i, '').length >= 3 && !x.core.includes('/'));
  if (!cands.length) return null;
  cands.sort((a, b) => b.core.length - a.core.length);
  const pick = cands[Math.floor(Math.random() * Math.min(3, cands.length))];
  return { idx: pick.i, word: pick.core, words };
}

function buildTest(lesson) {
  const ph = lesson.phrases;
  const pool = distractorPool(lesson);
  const N = Math.max(8, Math.min(12, ph.length));
  const plan = ['pick_src', 'listen', 'pick_it', 'pick_src', 'cloze', 'listen', 'pick_it', 'order', 'cloze', 'order', 'write', 'write'];
  const types = N >= 12 ? plan : plan.slice(0, N - 2).concat(['order', 'write']).slice(0, N);
  const fits = (p, t) => {
    const n = chipWords(p.it).length;
    if (t === 'cloze') return !!clozeOf(p);
    if (t === 'order') return n >= 3 && n <= 10;
    if (t === 'write') return n <= 10;
    return true;
  };
  let unused = shuffle(ph);
  const usedPairs = new Set();
  const qs = [];
  for (const t of types) {
    if (!unused.length) unused = shuffle(ph);
    let k = unused.findIndex(p => fits(p, t) && !usedPairs.has(p.id + t));
    let type = t;
    if (k < 0) { type = Math.random() < 0.5 ? 'pick_it' : 'pick_src'; k = unused.findIndex(p => !usedPairs.has(p.id + type)); }
    if (k < 0) k = 0;
    const p = unused.splice(k, 1)[0];
    usedPairs.add(p.id + type);
    const q = { type, p };
    if (type === 'pick_it') q.options = shuffle([p.it, ...pickDistractors(p, pool, 'it')]);
    if (type === 'pick_src' || type === 'listen') q.options = shuffle([p.src, ...pickDistractors(p, pool, 'src')]);
    if (type === 'cloze') {
      const c = clozeOf(p);
      q.cloze = c;
      const seen = new Set([normTxt(c.word), ...chipWords(p.it).map(normTxt)]), words = [];
      for (const x of shuffle(pool.flatMap(pp => chipWords(pp.it)))) {
        const k2 = normTxt(x);
        if (seen.has(k2) || x.includes('/') || x.replace(/^[a-z]+'/i, '').length < 3) continue;
        seen.add(k2); words.push(x.toLowerCase());
        if (words.length >= 3) break;
      }
      q.options = shuffle([c.word.toLowerCase(), ...words]);
    }
    if (type === 'order') {
      const w = chipWords(p.it);
      let s = shuffle(w);
      for (let i = 0; i < 5 && s.join(' ') === w.join(' '); i++) s = shuffle(w);
      q.chips = s;
    }
    qs.push(q);
  }
  return qs;
}

function startTest(lesson) {
  T = { lesson, qs: buildTest(lesson), idx: 0, correct: 0, mistakes: [] };
  document.title = `Test · ${lesson.title}`;
  renderTestQ();
}

const Q_LABEL = {
  pick_it: 'Vyber správný překlad',
  pick_src: 'Co to znamená?',
  listen: 'Poslouchej – co to znamená?',
  cloze: 'Doplň chybějící slovo',
  order: 'Slož větu ze slov',
  write: 'Napiš italsky',
};

function renderTestQ() {
  const { lesson, qs, idx } = T;
  if (idx >= qs.length) return renderTestResult();
  const q = qs[idx], p = q.p;
  T.answered = false;
  let body = '';
  const src = `<div class="big" style="font-size:1.25em">${esc(p.src)}</div>${p.hint ? `<div class="hint">💡 ${esc(p.hint)}</div>` : ''}`;
  const opts = list => `<div class="opts">${list.map((o, i) => `<button class="opt" data-opt="${i}">${esc(o)}</button>`).join('')}</div>`;
  if (q.type === 'pick_it') body = src + opts(q.options);
  if (q.type === 'pick_src') body = `<div class="big" style="font-size:1.3em">🇮🇹 ${esc(p.it)}</div>` + opts(q.options);
  if (q.type === 'listen') body = `<div class="audio-row"><button class="audio-btn lg" data-say="0">🔊</button><button class="audio-btn slow" data-say="1" style="align-self:center">🐢</button></div>` + opts(q.options);
  if (q.type === 'cloze') {
    const shown = q.cloze.words.map((w, i) => i === q.cloze.idx ? w.split(q.cloze.word).map(esc).join('<span class="blank">_____</span>') : esc(w)).join(' ');
    body = `<div class="mid">${flag(p)} ${esc(p.src)}</div><div class="big" style="font-size:1.3em">${shown}</div>` + opts(q.options);
  }
  if (q.type === 'order') body = src + `<div class="built" id="built"></div><div class="chips" id="chips">${q.chips.map((c, i) => `<button class="chip" data-chip="${i}">${esc(c)}</button>`).join('')}</div>`;
  if (q.type === 'write') body = src + `<textarea class="write-in" id="answer" rows="2" lang="it" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Napiš italsky…"></textarea>
    <div class="accents">${['à', 'è', 'é', 'ì', 'ò', 'ù'].map(c => `<button data-acc="${c}">${c}</button>`).join('')}</div>`;

  app.innerHTML = `<div class="session">
    <header class="top"><div class="wrap">
      <button class="icon-btn" data-go="#/l/${encodeURIComponent(lesson.id)}" aria-label="Zavřít">✕</button>
      <div style="flex:1;min-width:0"><h1>📝 Test</h1><div class="sub">${esc(lesson.title)}</div></div>
      <div class="sub" style="font-weight:700;color:#fff">${idx + 1} / ${qs.length}</div>
    </div><div class="sbar"><i style="width:${idx / qs.length * 100}%"></i></div></header>
    <div class="stage"><div class="wrap"><div class="card test-card-q" id="card">
      <div class="lbl">${Q_LABEL[q.type]}</div>${body}
      <div id="fb"></div>
    </div></div></div>
    <div class="foot"><div class="wrap" id="foot"></div></div>
  </div>`;
  bindGo();
  const foot = document.getElementById('foot');
  app.querySelectorAll('[data-say]').forEach(b => b.onclick = () => sayIt(p.it, b.dataset.say === '1'));
  if (q.type === 'listen') setTimeout(() => T && T.qs[T.idx] === q && sayIt(p.it), 250);

  if (q.options) {
    const correctOpt = q.type === 'pick_it' ? p.it : q.type === 'cloze' ? q.cloze.word.toLowerCase() : p.src;
    app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
      if (T.answered) return;
      const chosen = q.options[+b.dataset.opt];
      const ok = normTxt(chosen) === normTxt(correctOpt);
      app.querySelectorAll('[data-opt]').forEach(x => { if (normTxt(q.options[+x.dataset.opt]) === normTxt(correctOpt)) x.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      testAnswered(ok, ok ? null : chosen);
    });
    foot.innerHTML = '';
  }
  if (q.type === 'order') {
    const built = [];
    const chipsEl = document.getElementById('chips'), builtEl = document.getElementById('built');
    const draw = () => {
      builtEl.innerHTML = built.length ? built.map((ci, k) => `<button class="chip on" data-b="${k}">${esc(q.chips[ci])}</button>`).join('') : '<span class="built-ph">Klepej na slova ve správném pořadí</span>';
      chipsEl.querySelectorAll('[data-chip]').forEach(c => c.disabled = built.includes(+c.dataset.chip));
      builtEl.querySelectorAll('[data-b]').forEach(c => c.onclick = () => { if (T.answered) return; built.splice(+c.dataset.b, 1); draw(); });
      document.getElementById('checkBtn').disabled = built.length !== q.chips.length;
    };
    foot.innerHTML = `<button class="big-btn" id="checkBtn" disabled>Zkontrolovat</button>`;
    chipsEl.querySelectorAll('[data-chip]').forEach(c => c.onclick = () => { if (T.answered) return; built.push(+c.dataset.chip); draw(); });
    draw();
    document.getElementById('checkBtn').onclick = () => {
      const given = built.map(ci => q.chips[ci]).join(' ');
      const ok = normTxt(given) === normTxt(chipWords(p.it).join(' '));
      builtEl.classList.add(ok ? 'ok' : 'bad');
      testAnswered(ok, ok ? null : given);
    };
  }
  if (q.type === 'write') {
    const ta = document.getElementById('answer');
    setTimeout(() => ta.focus(), 50);
    app.querySelectorAll('[data-acc]').forEach(b => {
      b.onmousedown = e => e.preventDefault();
      b.onclick = () => { const s = ta.selectionStart, e2 = ta.selectionEnd; ta.value = ta.value.slice(0, s) + b.dataset.acc + ta.value.slice(e2); ta.selectionStart = ta.selectionEnd = s + 1; ta.focus(); };
    });
    const check = () => {
      if (T.answered) return;
      const given = ta.value.trim();
      const res = compare(p.it, given);
      const ok = res.score >= 80;
      ta.disabled = true;
      testAnswered(ok, ok ? null : (given || '—'), res);
    };
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); check(); } });
    foot.innerHTML = `<button class="big-btn" id="checkBtn">Zkontrolovat</button>`;
    document.getElementById('checkBtn').onclick = check;
  }
}

function testAnswered(ok, wrongGiven, res) {
  const q = T.qs[T.idx], p = q.p;
  T.answered = true;
  if (ok) T.correct++;
  else T.mistakes.push({ q, given: wrongGiven });
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">
    <b>${ok ? '✅ Správně!' : '❌ Špatně'}</b>
    ${res && !ok ? `<div class="diff">${diffHtml(res)}</div>` : ''}
    <div class="fb-ans">🇮🇹 ${esc(p.it)}<br><small>${flag(p)} ${esc(p.src)}</small></div>
  </div>`;
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  sayIt(p.it);
  document.getElementById('foot').innerHTML = `<button class="big-btn" id="nextQ">${T.idx + 1 < T.qs.length ? 'Další ▶' : 'Výsledek ▶'}</button>`;
  document.getElementById('nextQ').onclick = () => { stopSpeech(); T.idx++; renderTestQ(); };
}

function renderTestResult() {
  const { lesson, qs, correct, mistakes } = T;
  const pct = Math.round(correct / qs.length * 100);
  const passed = pct >= TEST_PASS;
  const prev = testBest(lesson);
  store.tests ||= {};
  if (prev === null || pct > prev) store.tests[lesson.id] = pct;
  store.points += correct * 2;
  const t = today();
  if (!store.days.includes(t)) store.days.push(t);
  saveStore();
  const o = orderedLessons();
  const nx = o[o.indexOf(lesson) + 1];
  app.innerHTML = `<div class="session">
    <header class="top"><div class="wrap">
      <button class="icon-btn" data-go="#/l/${encodeURIComponent(lesson.id)}" aria-label="Zavřít">✕</button>
      <h1>📝 Výsledek testu</h1>
    </div><div class="sbar"><i style="width:100%"></i></div></header>
    <main style="flex:1"><div class="wrap summary" style="padding-top:20px">
      <div class="trophy">${passed ? (pct === 100 ? '🏆' : '🎉') : '📚'}</div>
      <h2>${passed ? (pct === 100 ? 'Perfetto!' : 'Splněno!') : 'Ještě to nebude'}</h2>
      <p>${esc(lesson.title)} · ${correct} z ${qs.length} správně · +${correct * 2} bodů</p>
      <div class="test-score ${passed ? 'ok' : 'bad'}">${pct} %</div>
      <p style="font-size:0.85em">${passed ? 'Na splnění bylo potřeba ' + TEST_PASS + ' %. Můžeš jít dál!' : 'Na splnění potřebuješ ' + TEST_PASS + ' %. Projdi si chyby a zkus to znovu.'}${prev !== null ? ` · Nejlepší dřív: ${prev} %` : ''}</p>
      ${mistakes.length ? `<div class="section-title" style="text-align:left;margin-top:22px">Chyby</div>
        <div class="mistakes">${mistakes.map(m => `<div class="mistake">
          <div class="it">${esc(m.q.p.it)}</div>
          <div class="src">${flag(m.q.p)} ${esc(m.q.p.src)}</div>
          ${m.given ? `<div class="given">Tvoje odpověď: ${esc(m.given)}</div>` : ''}
        </div>`).join('')}</div>` : ''}
    </div></main>
    <div class="foot"><div class="wrap">
      <button class="big-btn ghost" id="retry">🔁 Znovu</button>
      ${passed && nx ? `<button class="big-btn" data-go="#/l/${encodeURIComponent(nx.id)}">Další lekce ▶</button>` : `<button class="big-btn" data-go="#/l/${encodeURIComponent(lesson.id)}">Zpět na lekci</button>`}
    </div></div>
  </div>`;
  bindGo();
  document.getElementById('retry').onclick = () => startTest(lesson);
}

// ═══════════════════════════════════════════════════════════
//  SYNCHRONIZACE MEZI ZAŘÍZENÍMI  (#/sync)
//  Pokrok se ukládá na Worker (Cloudflare KV) pod tajným kódem.
//  Kód je jen v tomhle zařízení; na serveru je uložený jako SHA-256.
// ═══════════════════════════════════════════════════════════
const SYNC_URL = 'https://flat-paper-f764.itsbobik.workers.dev/sync';
const SYNC_CODE_RE = /^[a-z0-9-]{12,64}$/;
let syncCode = null, syncLast = 0, syncErr = null, syncTimer = null, syncBusy = false, syncAgain = false;
try { syncCode = localStorage.getItem('lv2-sync-code'); syncLast = +localStorage.getItem('lv2-sync-last') || 0; } catch {}

function genSyncCode() {
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
  const c = [...crypto.getRandomValues(new Uint8Array(15))].map(x => abc[x % abc.length]).join('');
  return `bobik-${c.slice(0, 5)}-${c.slice(5, 10)}-${c.slice(10)}`;
}

// sloučení dvou stavů: u fráze vyhraje novější hodnocení, u testů a konverzací lepší výsledek
function mergeStores(a, b) {
  const out = { cards: {}, ts: {}, points: Math.max(a.points || 0, b.points || 0), tests: {}, dialogs: {} };
  out.days = [...new Set([...(a.days || []), ...(b.days || [])])].sort();
  const ids = new Set([...Object.keys(a.cards || {}), ...Object.keys(b.cards || {})]);
  for (const id of ids) {
    const ta = a.ts?.[id] || 0, tb = b.ts?.[id] || 0;
    const useA = a.cards?.[id] && (!b.cards?.[id] || ta >= tb);
    out.cards[id] = (useA ? a : b).cards[id];
    if (ta || tb) out.ts[id] = Math.max(ta, tb);
  }
  for (const k of ['tests', 'dialogs'])
    for (const src of [a[k] || {}, b[k] || {}])
      for (const [key, v] of Object.entries(src)) out[k][key] = Math.max(out[k][key] ?? -1, v);
  return out;
}

function setSyncCode(code) {
  syncCode = code;
  try { code ? localStorage.setItem('lv2-sync-code', code) : localStorage.removeItem('lv2-sync-code'); } catch {}
}

function scheduleSync() {
  if (!syncCode) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(), 2500);
}

async function syncNow({ rerender = false } = {}) {
  if (!syncCode) return;
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true; clearTimeout(syncTimer);
  const code = syncCode;
  try {
    const res = await fetch(SYNC_URL, { headers: { 'X-Sync-Code': code } });
    const remote = await res.json();
    if (!res.ok || remote.error) throw new Error(remote.error || res.status);
    if (code !== syncCode) return;
    const before = JSON.stringify(store);
    const merged = remote.data ? mergeStores(store, remote.data) : store;
    store = merged;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {}
    const put = await fetch(SYNC_URL, { method: 'PUT', headers: { 'X-Sync-Code': code, 'Content-Type': 'application/json' }, body: JSON.stringify({ data: store }) });
    if (!put.ok) throw new Error(put.status);
    syncLast = Date.now(); syncErr = null;
    try { localStorage.setItem('lv2-sync-last', String(syncLast)); } catch {}
    // přišlo něco nového z jiného zařízení → překreslit domov / lekci (ne uprostřed cvičení)
    if (rerender && JSON.stringify(store) !== before && location.hash.split('/').length <= 3) route();
  } catch (e) {
    syncErr = e.message || 'chyba sítě';
  } finally {
    syncBusy = false;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
    if (location.hash === '#/sync') renderSyncStatus();
  }
}

document.addEventListener('visibilitychange', () => {
  if (!syncCode) return;
  if (document.visibilityState === 'visible') syncNow({ rerender: true });
  else if (syncTimer) {
    // odcházíš z appky → odeslat hned, co čeká
    clearTimeout(syncTimer); syncTimer = null;
    const body = JSON.stringify({ data: store });
    fetch(SYNC_URL, { method: 'PUT', headers: { 'X-Sync-Code': syncCode, 'Content-Type': 'application/json' }, body, keepalive: body.length < 60000 }).catch(() => {});
  }
});

function agoText(t) {
  if (!t) return 'zatím nikdy';
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return 'právě teď';
  if (s < 3600) return `před ${Math.round(s / 60)} min`;
  if (s < 86400) return `před ${Math.round(s / 3600)} h`;
  return new Date(t).toLocaleString('cs-CZ');
}

function renderSyncStatus() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.innerHTML = syncBusy ? '🔄 Synchronizuji…'
    : syncErr ? `⚠️ Nepovedlo se (${esc(syncErr)}). Zkusím to znovu při další změně.`
    : `✅ Synchronizováno ${agoText(syncLast)}`;
}

function renderSync() {
  document.title = 'Synchronizace · Bobik Speaks Italian';
  app.innerHTML = `
    <header class="top"><div class="wrap">
      <button class="icon-btn" data-go="#/" aria-label="Zpět">←</button>
      <h1>☁️ Synchronizace</h1>
    </div></header>
    <main><div class="wrap">
      ${syncCode ? `
        <div class="sync-card">
          <div class="section-title">Tvůj synchronizační kód</div>
          <div class="sync-code" id="syncCode">${esc(syncCode)}</div>
          <button class="pill-btn" id="copyCode">📋 Kopírovat</button>
          <p class="sync-p">Na druhém zařízení otevři ☁️ Synchronizace → <b>Mám kód</b> a zadej tenhle kód. Pokrok se pak sám posílá a stahuje.</p>
          <p class="sync-p">🔒 Kód je jako heslo – kdo ho zná, vidí tvůj pokrok. Nikomu ho neposílej.</p>
          <div class="sync-status" id="syncStatus"></div>
          <div class="sync-btns">
            <button class="big-btn" id="syncNowBtn">🔄 Synchronizovat teď</button>
          </div>
          <button class="reset-link" id="unlink">Odpojit toto zařízení</button>
        </div>` : `
        <div class="sync-card">
          <p class="sync-p" style="margin-top:0">Pokrok se teď ukládá jen v tomhle zařízení. Se synchronizací uvidíš stejný pokrok na mobilu i na počítači – a máš zálohu.</p>
          <button class="big-btn" id="newCode" style="width:100%">✨ Vytvořit nový kód</button>
          <p class="sync-p" style="text-align:center">nebo</p>
          <div class="section-title">Mám kód z jiného zařízení</div>
          <input class="write-in" id="codeIn" placeholder="bobik-xxxxx-xxxxx-xxxxx" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="big-btn ghost" id="joinBtn" style="width:100%;margin-top:10px">Připojit</button>
          <div class="sync-status" id="joinMsg"></div>
        </div>`}
    </div></main>`;
  bindGo();
  if (syncCode) {
    renderSyncStatus();
    document.getElementById('syncNowBtn').onclick = () => { syncNow({ rerender: false }); renderSyncStatus(); };
    document.getElementById('copyCode').onclick = async e => {
      try { await navigator.clipboard.writeText(syncCode); e.currentTarget.textContent = '✅ Zkopírováno'; }
      catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('syncCode')); getSelection().removeAllRanges(); getSelection().addRange(r); }
    };
    document.getElementById('unlink').onclick = () => {
      if (!confirm('Odpojit toto zařízení? Pokrok tady zůstane, jen se přestane synchronizovat.')) return;
      setSyncCode(null); syncLast = 0; renderSync();
    };
  } else {
    document.getElementById('newCode').onclick = () => { setSyncCode(genSyncCode()); syncLast = 0; renderSync(); syncNow(); };
    document.getElementById('joinBtn').onclick = async () => {
      const code = document.getElementById('codeIn').value.trim().toLowerCase().replace(/\s+/g, '');
      const msg = document.getElementById('joinMsg');
      if (!SYNC_CODE_RE.test(code)) { msg.textContent = '⚠️ Tohle nevypadá jako kód (např. bobik-ab3cd-ef4gh-jk5mn).'; return; }
      msg.textContent = '🔄 Připojuji…';
      setSyncCode(code); syncLast = 0;
      await syncNow();
      if (syncErr) { msg.textContent = `⚠️ Nepovedlo se (${syncErr}).`; setSyncCode(null); return; }
      renderSync();
    };
  }
}

// ═══════════════════════════════════════════════════════════
//  KLÁVESNICE
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (!S || S.finished || !findMode(location.hash.split('/')[3])) return;
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (!S.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
  else if (S.revealed && ['1', '2', '3'].includes(e.key)) rateCard(['hard', 'good', 'easy'][+e.key - 1]);
  else if (e.key === 'Escape') go(`#/l/${encodeURIComponent(S.lesson.id)}`);
});

// pořadí lekcí = pořadí úrovní, v rámci úrovně pořadí v LESSONS
function orderedLessons() { return LEVELS.flatMap(lv => LESSONS.filter(l => l.level === lv.id)).concat(LESSONS.filter(l => !LEVELS.some(lv => lv.id === l.level))); }
function lessonNumber(l) { return orderedLessons().indexOf(l) + 1; }
function nextLesson() { const o = orderedLessons(); return o.find(l => !testPassed(l) && lessonProgress(l) < 60) || null; }
function md(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

function bindGo() { app.querySelectorAll('[data-go]').forEach(el => el.onclick = () => go(el.dataset.go)); }

route();
if (syncCode) syncNow({ rerender: true });
</script>
